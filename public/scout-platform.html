<style>
/* Layout: app shell from the Figma files. Fixed sidebar + sticky header, content in white cards on a pale paper ground. */
:root{
  --primary:#3B5292; --primary-2:#4362B2; --primary-3:#618DD0; --primary-100:#E2EBF7; --primary-200:#CCDDF1;

  --overlay:rgba(20,28,40,.45); --shadow:0 1px 2px rgba(30,40,46,.06),0 8px 24px rgba(30,40,46,.06);
  --f:"Google Sans Flex","Google Sans","Manrope",ui-sans-serif,system-ui,sans-serif;
  --r:12px; --r-lg:16px;
  --wa-bg:#EFEAE2; --wa-in:#FFFFFF; --wa-out:#D9FDD3; --wa-head:#1F273F; --wa-bar:#F0F2F5; --wa-link:#0B7AC5;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --primary:#8FB0E8; --primary-2:#7FA2E2; --primary-3:#618DD0; --primary-100:#1E2B47; --primary-200:#2A3A5E;
  --ink:#E8EEF4; --ink-2:#A9B4C0; --ink-3:#7A8592;
  --bg:#12171F; --paper:#0D1218; --card:#161D27; --line:#26303C; --field:#1C2531;
  --ok:#4FD1A5; --ok-bg:#12352B; --warn:#F2B35A; --warn-bg:#3A2A12; --err:#FF8097; --err-bg:#3E1520; --info:#7FC3FF; --info-bg:#132C44;
  --overlay:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --wa-bg:#0B141A; --wa-in:#202C33; --wa-out:#005C4B; --wa-head:#1F273F; --wa-bar:#1F2C34; --wa-link:#53BDEB; color-scheme:dark}}
:root[data-theme="dark"]{
  --primary:#8FB0E8; --primary-2:#7FA2E2; --primary-3:#618DD0; --primary-100:#1E2B47; --primary-200:#2A3A5E;
  --ink:#E8EEF4; --ink-2:#A9B4C0; --ink-3:#7A8592;
  --bg:#12171F; --paper:#0D1218; --card:#161D27; --line:#26303C; --field:#1C2531;
  --ok:#4FD1A5; --ok-bg:#12352B; --warn:#F2B35A; --warn-bg:#3A2A12; --err:#FF8097; --err-bg:#3E1520; --info:#7FC3FF; --info-bg:#132C44;
  --overlay:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --wa-bg:#0B141A; --wa-in:#202C33; --wa-out:#005C4B; --wa-head:#1F273F; --wa-bar:#1F2C34; --wa-link:#53BDEB; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:14px/1.55 var(--f);letter-spacing:.005em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary-3);outline-offset:2px}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.logo-dark{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo-light{display:none} :root:not([data-theme="light"]) .logo-dark{display:block}}
:root[data-theme="dark"] .logo-light{display:none} :root[data-theme="dark"] .logo-dark{display:block}

/* shell */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;gap:4px;overflow-y:auto}
.side .brand{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 18px}
.side .brand img{height:24px;width:auto}
.navlabel{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:14px 8px 6px}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--ink-2);text-decoration:none;border:1px solid transparent;background:none;width:100%;text-align:left}
.nav:hover{background:var(--field)}

.nav svg{width:18px;height:18px;flex:none}
.side .grow{flex:1}
.role{display:grid;grid-template-columns:1fr 1fr;background:var(--field);border-radius:10px;padding:3px;margin:8px 4px}
.role button{border:0;background:none;padding:7px 0;border-radius:8px;color:var(--ink-2);font-weight:500}
.role button.on{background:var(--card);color:var(--primary);box-shadow:var(--shadow)}
.ptsbox{background:var(--paper);border-radius:12px;padding:12px;margin:8px 4px;display:grid;gap:8px}
.me{display:flex;gap:10px;align-items:center;padding:12px 6px 4px;border-top:1px solid var(--line);margin-top:8px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--primary-200);color:var(--primary);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:64px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top h1{font-size:20px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu{display:none;border:0;background:none;padding:6px}
.content{padding-block:20px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.chip-loc{display:flex;align-items:center;gap:6px;background:var(--field);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.syncnote{font-size:12px;color:var(--ink-3)}
@media (max-width:900px){

  .chip-loc span.l{display:none}
}
.scrim{position:fixed;inset:0;background:var(--overlay);z-index:25}

/* blocks */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;min-width:0}
.card h2{font-size:18px}
.card .head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--line)}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.9fr) minmax(0,1fr)}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))} .g-main,.g3{grid-template-columns:1fr}}
@media (max-width:640px){.g4,.g2{grid-template-columns:1fr}}
.kpi{display:grid;gap:4px;position:relative}
.kpi .lab{color:var(--ink-2);font-size:13px}
.kpi .val{font-size:26px;font-weight:600}
.kpi .ico{position:absolute;right:0;top:0;width:36px;height:36px;border-radius:10px;background:var(--field);display:grid;place-items:center;color:var(--ink-2)}
.kpi .ico svg{width:18px;height:18px}
.delta{font-size:12px;color:var(--ink-2)} .delta b{color:var(--ok);font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:12px;border:1px solid transparent;background:var(--primary-2);color:#fff;font-weight:500;font-size:13.5px;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.soft{background:var(--primary-100);color:var(--primary);border-color:var(--primary-200)}
.btn.danger{background:var(--err-bg);color:var(--err);border-color:transparent}
.btn.okb{background:var(--ok);color:#fff}
.btn.sm{height:32px;padding:0 12px;font-size:12.5px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn svg{width:16px;height:16px}
.link{border:0;background:none;color:var(--primary-3);font-weight:500;padding:0;display:inline-flex;gap:4px;align-items:center}

.pill{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--field);color:var(--ink-2)}
.pill svg{width:13px;height:13px}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.err{background:var(--err-bg);color:var(--err)} .pill.info{background:var(--info-bg);color:var(--info)} .pill.pri{background:var(--primary-100);color:var(--primary)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;border:1px solid var(--line);font-size:12px;white-space:nowrap;background:var(--card)}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 12px;color:var(--ink-2);border-bottom:2px solid transparent;display:flex;gap:8px;align-items:center;white-space:nowrap;font-weight:500}
.tabs button.on{color:var(--primary);border-bottom-color:var(--primary)}
.tabs button[disabled]{opacity:.5;cursor:not-allowed}
.tabs .cnt{font-size:11px;background:var(--field);border-radius:6px;padding:1px 6px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:500;color:var(--ink-2);background:var(--paper);padding:10px 12px;white-space:nowrap}
td{padding:11px 12px;border-top:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:var(--paper)}
.bar{height:5px;border-radius:9px;background:var(--primary-100);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--primary-3);border-radius:9px}
.field{display:grid;gap:6px}
.field label,.flabel{font-size:13px;font-weight:500}
.in{height:42px;border-radius:12px;border:1px solid transparent;background:var(--field);padding:0 14px;width:100%}

.in:focus{border-color:var(--primary-3);background:var(--card);outline:none}
.search{display:flex;align-items:center;gap:8px;background:var(--field);border-radius:12px;padding:0 12px;height:38px;min-width:0}
.search input{border:0;background:none;outline:none;width:100%}
.search svg{width:16px;height:16px;color:var(--ink-3);flex:none}
.note{display:flex;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px}
.note.blue{background:var(--info-bg);border-color:transparent;color:var(--info)}
.note svg{width:18px;height:18px;flex:none;margin-top:1px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:grid;gap:12px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--ink-2)}
.empty{text-align:center;padding:36px 16px;color:var(--ink-2);display:grid;gap:10px;justify-items:center}
.empty svg{width:28px;height:28px;color:var(--ink-3)}
.feed{display:grid;gap:4px;max-height:410px;overflow-y:auto}

.stepper{display:flex;justify-content:center;gap:0;padding:4px 0 8px;overflow-x:auto}
.step{display:grid;justify-items:center;gap:6px;min-width:120px;position:relative;font-size:13px;color:var(--ink-3)}
.step .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--field);color:var(--ink-3);font-weight:600;font-size:13px;z-index:1}
.step.on{color:var(--ink)} .step.on .dot{background:var(--primary-2);color:#fff}
.step.done{color:var(--ink)} .step.done .dot{background:var(--primary-100);color:var(--primary)}
.step:not(:last-child)::after{content:"";position:absolute;top:14px;left:calc(50% + 18px);right:calc(-50% + 18px);height:1px;background:var(--line)}
.step .dot svg{width:14px;height:14px}
.narrow{max-width:760px;margin:0 auto;width:100%;display:grid;gap:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px;font-size:13px}

.qcard{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}

.opt{display:flex;gap:8px;align-items:center}

.drop{border:1.5px dashed var(--line);border-radius:14px;background:var(--paper);padding:22px;text-align:center;display:grid;gap:6px;justify-items:center;color:var(--ink-2);cursor:pointer;position:relative}

.file{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:13px}
.file svg{width:18px;height:18px;color:var(--primary-3)}
.center-card{max-width:440px;margin:40px auto;width:100%;text-align:center;display:grid;gap:14px;justify-items:center}
.ring{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.ring svg{width:22px;height:22px}
.ring.ok{background:var(--ok-bg);color:var(--ok)} .ring.pri{background:var(--primary-100);color:var(--primary)} .ring.err{background:var(--err-bg);color:var(--err)}
.pulse{width:22px;height:22px;border-radius:50%;background:var(--primary-3);animation:pulse 1.1s ease-in-out infinite}

.spin{width:16px;height:16px;border:2px solid var(--primary-200);border-top-color:var(--primary-2);border-radius:50%;animation:spin .8s linear infinite}

.checklist{display:grid;gap:6px;text-align:left;background:var(--paper);border-radius:12px;padding:12px 14px;width:100%}
.checklist div{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--ink-3)}
.checklist div.done{color:var(--ink)} .checklist div.now{color:var(--ink);font-weight:500}
.checklist .ck{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:none}
.checklist .done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.checklist .ck svg{width:11px;height:11px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
@media (max-width:1100px){.split{grid-template-columns:1fr}}
.panel{position:sticky;top:84px}
.task{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px;background:var(--card);cursor:pointer;text-align:left;width:100%}
.task.on{border-color:var(--primary-3);box-shadow:0 0 0 3px var(--primary-100)}
.task h3{font-size:15px}
.meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink-2)}
.meta span{display:inline-flex;gap:4px;align-items:center}

.modal-bg{position:fixed;inset:0;background:var(--overlay);z-index:40;display:grid;place-items:center;padding:16px}
.modal{background:var(--card);border-radius:18px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow-y:auto;padding:22px;display:grid;gap:14px;box-shadow:var(--shadow)}
.drawer-bg{position:fixed;inset:0;background:var(--overlay);z-index:40}

.onb .box{width:min(460px,100%);display:grid;gap:16px}
.prog{display:flex;gap:6px;align-items:center}
.prog i{flex:1;height:3px;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--primary-3)}
.perks{background:var(--paper);border-radius:14px;padding:14px;display:grid;gap:10px;text-align:left;font-size:13px}
.perks div{display:flex;gap:10px;align-items:center}
.perks svg{width:17px;height:17px;color:var(--primary-3)}
.sample{font-size:11px;color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:1px 6px;margin-left:6px;white-space:nowrap}
.waw{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:20px;align-items:start}

.wa{display:flex;flex-direction:column;height:min(760px,calc(100vh - 140px));min-height:520px;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:var(--wa-bg);box-shadow:var(--shadow)}
.wa-head{display:flex;gap:10px;align-items:center;padding:12px 14px;background:var(--wa-head);color:#fff}
.wa-av{width:36px;height:36px;border-radius:50%;background:#FFFFFF;display:grid;place-items:center;flex:none;overflow:hidden}
.wa-body{flex:1;overflow-y:auto;padding:14px 10px;display:flex;flex-direction:column;gap:6px}
.wa-row{display:flex} .wa-row.me{justify-content:flex-end}
.wa-b{max-width:84%;background:var(--wa-in);color:var(--ink);border-radius:12px 12px 12px 4px;padding:8px 10px 6px;font-size:13.5px;line-height:1.45;box-shadow:0 1px 1px rgba(0,0,0,.08);overflow-wrap:anywhere}
.wa-b.me{background:var(--wa-out);border-radius:12px 12px 4px 12px}
.wa-t{display:block;text-align:right;font-size:10.5px;color:var(--ink-3);margin-top:2px}
.wa-ticks{color:#34B7F1}
.wa-btns{display:grid;gap:1px;margin:8px -10px -6px;border-top:1px solid var(--line)}
.wa-btn{border:0;background:none;color:var(--wa-link);padding:9px 10px;font-weight:500;font-size:13.5px;border-top:1px solid var(--line)}
.wa-btn:first-child{border-top:0}
.wa-btn:hover:not([disabled]){background:var(--field)}
.wa-btn[disabled]{color:var(--ink-3);cursor:default}
.wa-btn.sel{background:var(--primary-100)}
.wa-loc,.wa-img{display:flex;gap:10px;align-items:center;min-width:180px}
.wa-loc svg,.wa-img svg{width:22px;height:22px;flex:none}
.wa-img{background:var(--field);border-radius:8px;padding:18px 12px;font-size:12px}
.wa-typing{display:flex;gap:4px;padding:12px}
.wa-typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:pulse 1s infinite}
.wa-typing i:nth-child(2){animation-delay:.15s} .wa-typing i:nth-child(3){animation-delay:.3s}
.wa-comp{display:flex;gap:8px;align-items:center;padding:8px;background:var(--wa-bar)}
.wa-comp input#wa-in{flex:1;min-width:0;height:40px;border-radius:20px;border:0;background:var(--card);padding:0 14px;outline:none}
.wa-cam,.wa-send{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;border:0;cursor:pointer;position:relative}
.wa-cam{color:var(--ink-2);background:none}
.wa-cam input{position:absolute;inset:0;opacity:0;cursor:pointer}
.wa-send{background:var(--wa-head);color:#fff}
.wa-cam svg,.wa-send svg{width:20px;height:20px}
/* investigations */
.gapc{display:grid;gap:8px}
.gap{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;text-align:left;display:grid;gap:2px;font-size:13px;width:100%}
.gap:hover{border-color:var(--primary-200)} .gap.on{border-color:var(--primary-3);background:var(--primary-100)}
.gap small{color:var(--ink-2);font-size:12px}
.funnel{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.funnel>div{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:2px;font-size:12px;color:var(--ink-2);background:var(--card)}

.step{text-align:center;min-width:140px;padding:0 4px}

.life{justify-content:flex-start}
.wa-prev{background:var(--wa-bg);border-radius:14px;padding:12px}

.brief{display:grid;gap:14px}
.brief h3{font-size:15px;margin-bottom:6px}
.brief ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:13.5px}
.refs{display:inline-flex;gap:4px;flex-wrap:wrap;margin-left:6px;vertical-align:middle}

.conf{font-size:11px;border-radius:6px;padding:1px 6px;margin-left:6px;background:var(--field);color:var(--ink-2);white-space:nowrap}

  const earned = ms.filter(s => s.status === 'approved').reduce((a, s) => a + (s.reward || 0), 0);
  const pending = ms.filter(s => s.status === 'pending').reduce((a, s) => a + (s.reward || 0), 0);
  const out = myTx().filter(t => t.kind === 'withdrawal' && t.status !== 'failed').reduce((a, t) => a + t.amountPts, 0);
  return {earned, pending, available: Math.max(0, earned - out), withdrawn: out};
}

/* ---------------- routing ---------------- */
function route() {
  const h = (location.hash || '').slice(1);
  const home = {role: SIDE === 'scout' ? 'scout' : 'client', page: SIDE === 'scout' ? 'chat' : 'overview', id: null};
  if (!h) return home;
  const [r, page, ...rest] = h.split('-');
  if (SIDE && (r === 's') !== (SIDE === 'scout')) return home;
  return {role: r === 's' ? 'scout' : 'client', page: page || 'overview', id: rest.join('-') || null};
}
function go(h) { if (location.hash.slice(1) === h) render(); else location.hash = h; S.ui.sidebar = false; }
window.addEventListener('hashchange', () => { closeLayer(); render(); window.scrollTo(0, 0); });

/* render scheduling: forms are not re-rendered by live data */
let rq = null;
function scheduleRender(force) {
  const r = route();
  const formPage = (r.role === 'client' && r.page === 'builder') || (r.role === 'scout' && !myScout());
  if (formPage) return;
  if (rq) return; rq = requestAnimationFrame(() => { rq = null; render(); });
}

/* ---------------- charts ---------------- */
function bars(vals, labels, {h = 180, hi = -1, fmtv = (v) => fmt(v)} = {}) {
  const W = 1000, pad = 30, max = Math.max(1, ...vals) * 1.15, bw = (W - pad) / vals.length;
  const ticks = [0, .25, .5, .75, 1].map(f => max * f);
  return `<svg class="chart" viewBox="0 0 ${W} ${h + 22}" role="img">
  <g class="grid">${ticks.map(t => { const y = h - t / max * h; return `<line x1="${pad}" x2="${W}" y1="${y}" y2="${y}"/><text x="0" y="${y + 3}">${fmt(t)}</text>`; }).join('')}</g>
  ${vals.map((v, i) => { const bh = v / max * h, x = pad + i * bw + bw * .14; return `<rect x="${x}" y="${h - bh}" width="${bw * .72}" height="${bh}" rx="4" fill="${i === hi ? 'var(--primary-2)' : 'var(--primary-200)'}"><title>${esc(labels[i])}: ${fmtv(v)}</title></rect>`; }).join('')}
  ${labels.map((l, i) => (vals.length > 14 && i % 2) ? '' : `<text x="${pad + i * bw + bw / 2}" y="${h + 15}" text-anchor="middle">${esc(l)}</text>`).join('')}</svg>`;
}
function area(vals, labels, {h = 170} = {}) {
  const W = 1000, pad = 30, max = Math.max(1, ...vals) * 1.2, n = Math.max(1, vals.length - 1);
  const xs = vals.map((_, i) => pad + i / n * (W - pad)), ys = vals.map(v => h - v / max * h);
  const d = xs.map((x, i) => (i ? 'L' : 'M') + x.toFixed(1) + ',' + ys[i].toFixed(1)).join(' ');
  const ticks = [0, .5, 1].map(f => max * f);
  return `<svg class="chart" viewBox="0 0 ${W} ${h + 22}" role="img"><g class="grid">${ticks.map(t => { const y = h - t / max * h; return `<line x1="${pad}" x2="${W}" y1="${y}" y2="${y}"/><text x="0" y="${y + 3}">${fmt(t)}</text>`; }).join('')}</g>
  <path d="${d} L${xs[xs.length - 1]},${h} L${pad},${h} Z" fill="var(--primary-3)" fill-opacity=".14"/><path d="${d}" fill="none" stroke="var(--primary-3)" stroke-width="2.2"/>
  ${vals.length ? `<circle cx="${xs[xs.length - 1]}" cy="${ys[ys.length - 1]}" r="4.5" fill="var(--card)" stroke="var(--primary-2)" stroke-width="2.5"/>` : ''}
  ${labels.map((l, i) => (labels.length > 8 && i % Math.ceil(labels.length / 8)) ? '' : `<text x="${xs[i]}" y="${h + 15}" text-anchor="middle">${esc(l)}</text>`).join('')}</svg>`;
}
function donut(segs, center, sub) {
  const tot = segs.reduce((a, s) => a + s[1], 0) || 1, R = 52, C = 2 * Math.PI * R; let off = 0;
  return `<svg class="chart" viewBox="0 0 140 140" style="max-width:150px" role="img"><circle cx="70" cy="70" r="${R}" fill="none" stroke="var(--field)" stroke-width="16"/>
  ${segs.map(([, v, c]) => { const L = v / tot * C; const s = `<circle cx="70" cy="70" r="${R}" fill="none" stroke="${c}" stroke-width="16" stroke-dasharray="${L} ${C - L}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`; off += L; return s; }).join('')}
  <text x="70" y="66" text-anchor="middle" style="font-size:11px">${esc(sub)}</text><text x="70" y="86" text-anchor="middle" style="font-size:20px;fill:var(--ink);font-weight:600">${esc(center)}</text></svg>`;
}

function track(s, list) {
  const cur = LIFE.indexOf(life(s) === 'paused' ? 'gathering' : life(s)), names = ['Draft', 'Deployed', 'Gathering evidence', 'Under review', 'Completed'];

    <div class="funnel"><div>Sent to SavoScouts<b class="num">${s.status === 'draft' ? '—' : eligible}</b>via the Verisavo agent</div><div>Responses submitted<b class="num">${list.length}<span class="faint" style="font-size:13px"> / ${s.target}</span></b>${pct(list.length, s.target)}% of coverage</div><div>Awaiting review<b class="num">${pend}</b>${pend ? 'needs your team' : 'nothing waiting'}</div><div>Verified<b class="num">${ok}</b>VeriPoints released</div></div>

  return `
  <div class="card"><div class="head"><h2>Response activity</h2>${statusBtns}</div>
    <div class="grid g4" style="margin-bottom:12px">
      <div class="kpi"><span class="lab">Responses</span><span class="val num" style="font-size:20px">${fmt(list.length)} <span class="faint" style="font-size:13px">of ${s.target}</span></span></div>
      <div class="kpi"><span class="lab">Peak hour</span><span class="val num" style="font-size:20px">${list.length ? String(peak).padStart(2, '0') + ':00' : '—'}</span></div>
      <div class="kpi"><span class="lab">Verification rate</span><span class="val num" style="font-size:20px">${ok + rej ? pct(ok, ok + rej) + '%' : '—'}</span></div>

function processed(s, list) {
  const okList = list.filter(x => x.status !== 'rejected');

  const qs = s.questions || [];

    const avg = allv.reduce((a, b) => a + b, 0) / allv.length, mx = Math.max(...per), lo = Math.min(...per.filter(v => v > 0));

      <div class="grid g3" style="margin-bottom:10px;font-size:12px"><div><span class="muted">Average</span><div class="num" style="font-size:18px;font-weight:600">${fmt(avg, 1)}${esc(unit)}</div></div>
      <div><span class="muted">Lowest region</span><div class="num" style="font-size:18px;font-weight:600">${fmt(lo, 1)}</div><span class="faint">${esc(regions[per.indexOf(lo)] || '')}</span></div>
      <div><span class="muted">Highest region</span><div class="num" style="font-size:18px;font-weight:600">${fmt(mx, 1)}</div><span class="faint">${esc(regions[per.indexOf(mx)] || '')}</span></div></div>
      ${bars(per.map(v => Math.round(v * 10) / 10), regions, {h: 150, hi: per.indexOf(mx), fmtv: v => fmt(v, 1) + unit})}</div>`;
  }).join('');
  const choiceBlock = choiceQ.map(q => {
    const c = {}; (q.options || []).forEach(o => c[o] = 0);
    okList.forEach(x => { const a = x.answers?.[q.id]; (Array.isArray(a) ? a : [a]).forEach(v => { if (v) c[v] = (c[v] || 0) + 1; }); });

  }).join('');

  return `
  <div class="grid g-main">
    <div class="stack">${numBlock || ''}${choiceBlock || (numBlock ? '' : `<div class="card">${emptyState('chart', 'No chartable questions', 'Number, scale and choice questions are summarised here.')}</div>`)}</div>
    <div class="stack">
      <div class="card"><div class="head"><h2>Evidence verification</h2></div>
        <div class="row" style="flex-wrap:nowrap;align-items:center">${donut([['Verified', ok, 'var(--primary-3)'], ['Not verified', rej, 'var(--err)'], ['Awaiting', pend, 'var(--warn)']], fmt(list.length), 'Total')}
        <div class="stack" style="gap:6px;font-size:13px"><div class="legend" style="display:grid;gap:6px"><span><i style="background:var(--primary-3)"></i>Verified ${ok}</span><span><i style="background:var(--err)"></i>Not verified ${rej}</span><span><i style="background:var(--warn)"></i>Awaiting review ${pend}</span></div>
        <span class="muted">Verification rate <b class="num" style="color:var(--ink)">${ok + rej ? pct(ok, ok + rej) + '%' : '—'}</b></span></div></div></div>
      <div class="card"><div class="head"><h2>Regional summary</h2></div><div class="tbl-wrap"><table><thead><tr><th>Region</th><th>Responses</th>${firstNum ? `<th>Avg. ${esc(firstNum.short || 'value')}</th>` : ''}<th>Verified</th></tr></thead><tbody>
        ${matrix.map(m => `<tr><td>${esc(m.rg)}</td><td class="num">${m.n}</td>${firstNum ? `<td class="num">${m.avg === null ? '—' : fmt(m.avg, 1)}</td>` : ''}<td>${m.rate === null ? '<span class="faint">—</span>' : `<span class="pill ${m.rate >= 90 ? 'ok' : m.rate >= 70 ? 'warn' : 'err'} num">${m.rate}%</span>`}</td></tr>`).join('')}</tbody></table></div></div>

/* ---------- AI briefing ---------- */
const sid6 = (id) => 'SUB-' + id.slice(-6).toUpperCase();
const refBtns = (ids) => (ids || []).length ? `<span class="refs">${ids.slice(0, 4).map(i => S.submissions[i] ? `<button data-act="ref" data-id="${i}" title="Open response">${sid6(i)}</button>` : '').join('')}</span>` : '';
function localBrief(s, list) {
  const okL = list.filter(x => x.status === 'approved'), use = okL.length ? okL : list.filter(x => x.status === 'pending'), rej = list.filter(x => x.status === 'rejected');
  const qs = s.questions || [], F = [], AG = [], CO = [], UN = [], NX = [];
  qs.filter(q => ['number', 'scale', 'rating'].includes(q.type)).forEach(q => {
    const v = use.map(x => [x.id, Number(x.answers?.[q.id]), x.region]).filter(a => !isNaN(a[1]) && a[1] !== 0); if (!v.length) return;
    const nums = v.map(a => a[1]), avg = nums.reduce((a, b) => a + b, 0) / nums.length, lo = Math.min(...nums), hi = Math.max(...nums), u = q.unit ? ' ' + q.unit : '';
    F.push({text: `${q.text.replace(/\?$/, '')}: average ${fmt(avg, 1)}${u}, ranging from ${fmt(lo, 1)} to ${fmt(hi, 1)} across ${v.length} responses.`, confidence: v.length >= 5 && okL.length ? 'High' : v.length >= 3 ? 'Medium' : 'Low', refs: v.map(a => a[0])});
    if (avg && (hi - lo) / avg > .3) CO.push({text: `Responses on “${q.text}” differ by more than 30%. This may reflect real differences between locations rather than error.`, refs: [v.find(a => a[1] === lo)[0], v.find(a => a[1] === hi)[0]]});
  });
  qs.filter(q => q.type === 'single' || q.type === 'multi').forEach(q => {
    const c = {}; use.forEach(x => { const a = x.answers?.[q.id]; (Array.isArray(a) ? a : [a]).forEach(o => { if (o) (c[o] ||= []).push(x.id); }); });
    const top = Object.entries(c).sort((a, b) => b[1].length - a[1].length)[0]; if (!top) return;
    const share = pct(top[1].length, use.length);
    (share >= 70 ? AG : F).push({text: `${q.text.replace(/\?$/, '')}: “${top[0]}” in ${share}% of responses.`, confidence: share >= 70 && top[1].length >= 3 ? 'High' : 'Medium', refs: top[1]});
  });
  if (rej.length) CO.push({text: `${rej.length} response${rej.length === 1 ? ' was' : 's were'} not verified and ${rej.length === 1 ? 'is' : 'are'} excluded from these findings.`, refs: rej.map(x => x.id)});
  (s.regions || []).filter(rg => !list.some(x => x.region === rg)).forEach(rg => UN.push({text: `No responses from ${rg} yet, so findings may not represent it.`}));
  if (list.length < s.target) UN.push({text: `Coverage is ${list.length} of ${s.target} planned responses. Findings may change as more evidence arrives.`});
  if (!okL.length && use.length) UN.push({text: 'No response has been verified yet. Findings are drawn from responses awaiting review.'});
  if (list.some(x => x.status === 'pending')) NX.push({text: 'Review the responses awaiting verification, then update this briefing.'});
  if (UN.length) NX.push({text: 'Extend coverage to the regions and outlets still missing before making a decision that depends on them.'});
  NX.push({text: 'Return to the Intelligence Assistant to connect these findings with what Verisavo already knows about this market.'});

}
async function genBrief(id) {
  const s = S.surveys[id]; if (!s) return;
  const list = subsOf(id), btn = $('#genbrief'); if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Analysing evidence…'; }
  let b = localBrief({id, ...s}, list);
  if (SAMPLER && list.length) {
    try {
      const qmap = Object.fromEntries((s.questions || []).map(q => [q.id, q.text]));
      const rows = list.filter(x => x.status !== 'rejected').slice(0, 40).map(x => ({id: x.id, region: x.region, status: x.status === 'approved' ? 'verified' : 'awaiting review', answers: Object.fromEntries(Object.entries(x.answers || {}).map(([k, v]) => [qmap[k] || k, v]))}));
      const out = await SAMPLER.json(`You are the Verisavo Intelligence Assistant writing an investigation briefing for a business. Use only the evidence below. Separate what is supported from what is inferred, and never claim certainty the evidence does not give. British English, plain language, no hype.
Investigation: ${s.title}. Objective: ${s.request || s.title}. Place: ${(s.regions || []).join(', ')}, ${s.country}. Planned responses: ${s.target}; received: ${list.length}; not verified: ${list.filter(x => x.status === 'rejected').length}.
Responses (JSON): ${JSON.stringify(rows)}
Return JSON only: {"summary": one or two sentences, "findings": [{"text","confidence":"High"|"Medium"|"Low","refs":[response ids]}], "agreements": [{"text","refs"}], "contradictions": [{"text","refs"}], "implications": [{"text"}], "unknowns": [{"text"}], "next": [{"text"}]}. 2 to 5 findings; each list may be empty.`, {modelTier: 'quick'});

    } catch (e) { if (e && e.code === 'rate_limited') toast('Too many requests. Showing a summary built from the responses instead.'); }
  }
  await patch('surveys', id, {briefing: b}); toast('Briefing ready.');
}

      <div class="kv"><span>Verified</span><b class="num">${list.filter(x => x.status === 'approved').length}</b></div><div class="kv"><span>Awaiting review</span><b class="num">${list.filter(x => x.status === 'pending').length}</b></div><div class="kv"><span>Not verified (excluded)</span><b class="num">${list.filter(x => x.status === 'rejected').length}</b></div>

let W = null, typing = false, WAFULL = false;

  }

    if (c.stage === 'amount') { const n = parseFloat(t.replace(/[^0-9.]/g, '')), w = wallet(); mine(t); if (isNaN(n) || n < 10 || n > w.available) return reply(() => say(`Please reply with a number between 10 and ${fmt(w.available, 2)}.`)); c.amount = Math.round(n * 100) / 100; c.stage = 'method'; return reply(() => say('Where should we send it?', [{l: 'Mobile money', a: 'wdm', v: 'Mobile money'}, {l: 'Bank transfer', a: 'wdm', v: 'Bank transfer'}, {l: 'Airtime', a: 'wdm', v: 'Airtime'}])); }

}

async function genQuestions() {
  const desc = (B.ai || '').trim() || B.title || 'market prices and availability';
  const btn = $('#genq'); if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Generating…'; }
  let qs = null;
  if (SAMPLER) {
    try {
      const prompt = `You write field-survey questions for market scouts in ${B.country || 'an African market'} (${(B.regions || []).join(', ') || 'local markets'}). Industry: ${B.industry || 'general'}. The client wants to understand: ${desc}.
Return JSON only: an array of 6 to 8 objects {"type": one of "short","paragraph","single","multi","number","scale","photo", "text": the question as a scout would read it, "options": array of 3-5 short options for single/multi only, "unit": unit text for number only}. Questions must be observable by a person standing in a market. Include exactly one photo question and at least one number question about price.`;
      const out = await SAMPLER.json(prompt, {modelTier: 'quick'});
      if (Array.isArray(out)) qs = out.filter(q => q && q.text && QTYPES.some(t => t[0] === q.type)).slice(0, 12).map(q => ({id: uid('q'), type: q.type, text: String(q.text), options: (q.type === 'single' || q.type === 'multi') ? (q.options || []).map(String).slice(0, 6) : undefined, unit: q.type === 'number' ? (q.unit || '') : undefined}));

  Object.entries(S.surveys).sort((a, b) => (a[1].createdAt || 0) - (b[1].createdAt || 0)).forEach(([id, sv]) => {
    if (!seen.has(sv.title)) { seen.add(sv.title); return; }
    if (!sv.sample) return;
    const m = sv.title.match(/ price check in (.+)$/), city = m ? m[1] : (sv.regions || [])[0] || '';
    const name = (P.find(x => !seen.has(x + ' price check in ' + city)) || 'Market') + ' price check in ' + city;
    sv.title = name; seen.add(name); changed = true;
    Object.values(S.submissions).forEach(x => { if (x.surveyId === id) x.surveyTitle = name; });
  });
  if (changed) saveLocal();
}

/* ---------------- boot ---------------- */
async function boot() {
  loadLocal();
  const use = window.claude && window.claude.use ? window.claude.use.bind(window.claude) : null;
  if (!use) { seed(); dedupe(); }
  if (QS.get('gap') && SIDE !== 'scout') { newBuilder(); B.gap = QS.get('gap'); B.ai = QS.get('gap'); }
  render();
  if (!use) { S.loaded = true; render(); return; }
  const timer = setTimeout(() => { S.slow = true; render(); }, 10000);
  const [db, user, sample] = await Promise.all([use('db').catch(() => null), use('user').catch(() => null), use('sample').catch(() => null)]);
  SAMPLER = sample || null;
  if (user) { try { const id = await user.id(); if (id) S.me = id; } catch (e) {} try { const c = await user.can('data.write'); if (c === false) S.canWrite = false; } catch (e) {} }
  if (!db) { clearTimeout(timer); S.loaded = true; render(); return; }
  DB = db; COLLS.forEach(c => S[c] = {});
  let got = 0;
  COLLS.forEach(c => db.collection(c).onSnapshot(snap => {
    const o = {}; snap.docs.forEach(d => { if (d.exists) o[d.id] = d.data(); }); S[c] = o;
    if (!snap.metadata.fromCache && !S['_l' + c]) { S['_l' + c] = 1; got++; if (got === COLLS.length) { clearTimeout(timer); S.loaded = true; S.slow = false; return render(); } }
    scheduleRender();
  }, err => { clearTimeout(timer); if (!S.loaded) { S.loaded = true; render(); } }));
}
boot();
</script>
