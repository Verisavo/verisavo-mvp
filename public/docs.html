  <p class="intro">SavoScouts gather Ground-Level Intelligence where existing evidence falls short, and are rewarded for verified work.</p>
  <h2 id="savoscouts">SavoScouts</h2>
  <p>SavoScouts are Verisavo's network of contributors in local markets. They gather Ground-Level Intelligence when existing evidence cannot answer a question that matters. ${DEV}</p>
  <h3 id="lifecycle">How an investigation works</h3>
  <ol class="steps">
   <li><b>Intelligence Gap</b><p>A specific question existing evidence cannot answer.</p></li>
   <li><b>Brief</b><p>A short task: what to observe, where, when and how.</p></li>
   <li><b>Consent</b><p>Anyone asked a question knows who is asking and can decline.</p></li>
   <li><b>Capture</b><p>Each observation is geo-tagged, time-stamped and recorded with its method.</p></li>
   <li><b>Verification</b><p>Checks compare it with other sources, contributors and earlier findings.</p></li>
   <li><b>Evidence</b><p>The finding joins your picture of the market, with its provenance intact.</p></li>
  </ol>
  <h3 id="channels">Capture channels</h3>
  <p>Depending on the deployment, SavoScouts can report through the mobile app, WhatsApp, SMS, USSD or voice, so the network is not limited to smartphone users.</p>
  <h3 id="rewards">Rewards</h3>
  <p>SavoScouts are designed to earn rewards for verified observations and short tasks. <a href="#scout-rewards">How SavoScout rewards work</a> explains how the scheme protects the quality of the evidence you receive.</p>
  ${note("Targeted Ground-Level Intelligence investigations are in development. Get early access to hear when they open.")}
  <h2 id="scout-rewards">SavoScout rewards</h2>
  <p>SavoScouts are designed to earn rewards for the observations and short, structured tasks they complete. How contributors are rewarded shapes the evidence that comes back, so the scheme is built around quality rather than volume. ${DEV}</p>
  <h3 id="what-earns">What earns a reward</h3>
  <ul><li><strong>Observations</strong> requested in a brief, such as a shelf price, a stock check or a photo of a display.</li><li><strong>Short questions and surveys</strong> that Verisavo deploys to answer a specific Intelligence Gap.</li></ul>
  <p>Every task comes from a brief tied to a real question, so a contributor always knows what is being asked, where and why.</p>
  <h3 id="quality">How the scheme protects quality</h3>
  <div class="tbl"><table><thead><tr><th>Rule</th><th>Why it matters</th></tr></thead><tbody>
   <tr><th>Rewarded once verified</th><td>An observation counts when it passes <a href="#verification">verification</a>, not when it is submitted. There is no reward for guessing.</td></tr>
   <tr><th>Useful over plentiful</th><td>Each task answers a specific Intelligence Gap, so submitting more than the brief asks for earns nothing.</td></tr>
   <tr><th>Reliability builds over time</th><td>Each contributor builds a reliability record. Consistent, accurate work carries more weight in verification and opens more tasks.</td></tr>
   <tr><th>Low quality has a cost</th><td>Repeated inaccurate or unverifiable submissions reduce access to future tasks.</td></tr>
   <tr><th>Checked whatever the reward</th><td>Spot checks, cross-source comparison and confirmation from other contributors apply to every observation.</td></tr>
  </tbody></table></div>
  <h3 id="consent">Rewards and the people asked</h3>
  <p>Rewards are paid to SavoScouts for their work. The shopkeepers, traders and customers they speak to are never pressured to take part: they know who is asking and can decline.</p>
  ${note("Reward amounts, payment methods and eligibility will vary by country and are still being finalised. Full details will be published in a separate guide for SavoScouts.")}` },
 { g: "Use Verisavo", id: "market-simulation", t: "Market Simulation", ic: "layers", crumb: "Use Verisavo", body: `
  <p class="intro">Market Simulation is designed to help you explore possible outcomes under different assumptions before you commit. ${PLAN}</p>
  <h2 id="what">What it will do</h2>
  <ul><li>Compare options, such as launching in one district or two</li><li>Show the assumptions behind each scenario</li><li>Test how sensitive an outcome is to a change in price, distribution or demand</li></ul>
  <h2 id="how">How a scenario is built</h2>
  <ol class="steps"><li><b>Start with the decision</b><p>For example: launch small solar kits in Lugbe, in Gwarinpa, or in both.</p></li><li><b>Set the options</b><p>Each option is a scenario to compare, not a forecast to trust.</p></li><li><b>Make the assumptions visible</b><p>Each input is labelled as an Assumption, with the evidence it rests on, so you can see what the result depends on.</p></li><li><b>Read the result as a range</b><p>Outcomes are shown as ranges, alongside which assumptions move them most.</p></li></ol>
  <h2 id="example">Example assumptions</h2>
  <div class="tbl"><table><thead><tr><th>Assumption</th><th>Based on</th><th>If it is wrong</th></tr></thead><tbody>
   <tr><th>Enquiries stay at current levels</th><td>Your enquiry data for the last quarter</td><td>Both options shrink, but the ranking may hold</td></tr>
   <tr><th>Smaller kits convert better</th><td>A hypothesis from field conversations, not yet tested</td><td>The case for Lugbe weakens</td></tr>
   <tr><th>No new competitor enters</th><td>No evidence either way</td><td>Treated as a gap worth checking first</td></tr>
  </tbody></table></div>
  ${note("<b>Simulation is not prediction.</b> It helps you explore and compare, with every assumption visible. It does not tell you what will happen.", "warn")}` },
 { g: "Reference", id: "privacy", t: "Privacy and responsible use", ic: "shield", crumb: "Reference", body: `
  <p class="intro">How your company data is protected, and how to use Verisavo’s intelligence responsibly.</p>
  <h2 id="privacy">Privacy and your data</h2>
  <p>Your company data stays private, protected and under your control.</p>
  <h3 id="two-kinds">Two kinds of intelligence</h3>
  <div class="tbl"><table><thead><tr><th></th><th>Client Intelligence</th><th>Platform Intelligence</th></tr></thead><tbody>
   <tr><th>What it is</th><td>Information belonging to your organisation, or collected for it</td><td>Evidence in Verisavo's wider environment</td></tr>
   <tr><th>Who can see it</th><td>Your organisation only</td><td>Users, within permissions and sourcing rules</td></tr>
   <tr><th>Used to answer others</th><td>Never</td><td>Yes, under governance rules</td></tr>
  </tbody></table></div>
  <p>Company data, questions and files you share are used only to provide the service to you. They are never shown to, or shared with, other customers.</p>
  <h2 id="responsible-use">Responsible use</h2>
  <p>How Verisavo is designed to keep decisions grounded and fair to the people in the market.</p>
  <ul><li><strong>Decisions stay human.</strong> Verisavo supports the decision; the people responsible make it.</li><li><strong>No false certainty.</strong> Findings make clear how well the evidence supports them, and unknowns stay visible.</li><li><strong>Markets, not individuals.</strong> Field work prefers observations about markets over information about people, and asks for consent before asking questions.</li><li><strong>Africa is not one market.</strong> Evidence carries its geography, so a finding from one city is not stretched across a continent.</li></ul>` },
 { g: "Reference", id: "roadmap", t: "Roadmap", ic: "clock", crumb: "Reference", body: `
  <p class="intro">Where each part of Verisavo stands today. This page changes as features move forward, so it is the place to check what is available.</p>
  <h2 id="now">In early access</h2>
  <div class="tbl"><table><thead><tr><th>Feature</th><th>What it means</th><th>Status</th></tr></thead><tbody>
   <tr><th>Intelligence Assistant on WhatsApp</th><td>Ask market questions in plain language through early access.</td><td>${EA}</td></tr>
   <tr><th>Evidence in answers</th><td>Answers show where findings come from and how well they are supported.</td><td>${EA}</td></tr>
   <tr><th>Intelligence Gaps</th><td>Questions the evidence cannot answer are named, with what would close them.</td><td>${EA}</td></tr>
  </tbody></table></div>
  <h2 id="building">In development</h2>
  <div class="tbl"><table><thead><tr><th>Feature</th><th>What it means</th><th>Status</th></tr></thead><tbody>
   <tr><th>Web app</th><td>The Intelligence Assistant in the browser, alongside WhatsApp.</td><td>${DEV}</td></tr>
   <tr><th>SavoScouts investigations</th><td>Targeted Ground-Level Intelligence for a specific gap.</td><td>${DEV}</td></tr>
   <tr><th>Verification</th><td>Systematic reliability checks across sources and contributors.</td><td>${DEV}</td></tr>
   <tr><th>Market Intelligence Network</th><td>Explore the connections between businesses, products, places and events.</td><td>${DEV}</td></tr>
   <tr><th>Market Memory</th><td>See how understanding of a market has changed over time.</td><td>${DEV}</td></tr>
  </tbody></table></div>
  <h2 id="planned">Planned</h2>

 { g: "Reference", id: "faq", t: "FAQ and glossary", ic: "chat", crumb: "Reference", body: `
  <p class="intro">Common questions, followed by the terms used across Verisavo.</p>
  <h2 id="faq">FAQ</h2>
  <p>Short answers to common questions.</p>
  <details class="faq"><summary>How is Verisavo different from a general AI assistant?</summary><p>Answers are built from connected market evidence. They are designed to show their sources, how reliable they are and what is still unknown, and gaps can be investigated on the ground as SavoScouts come online.</p></details>
  <details class="faq"><summary>How does Verisavo connect the evidence?</summary><p>Through the <a href="#intelligence-graph">Market Intelligence Network</a>. It links businesses, products, customers, competitors, prices, places and events, and keeps every link tied to its evidence and date. A connection shows where to look, not what caused a change, so each finding still shows how well the evidence supports it.</p></details>
  <details class="faq"><summary>Which markets does Verisavo cover?</summary><p>Verisavo is being built for African markets, starting with selected cities. Coverage grows as evidence and investigations build up.</p></details>
  <details class="faq"><summary>Can I use Verisavo on WhatsApp?</summary><p>Yes. Verisavo works on the web and on WhatsApp.</p></details>
  <details class="faq"><summary>Is my company data shared with other customers?</summary><p>No. Your company data stays private, protected and under your control.</p></details>
  <details class="faq"><summary>What happens when Verisavo does not know?</summary><p>It says so and names the Intelligence Gap, so you can decide whether to accept the uncertainty, add your own data or investigate.</p></details>
  <details class="faq"><summary>How much does Verisavo cost?</summary><p>Your first 5 questions are free. Verisavo Monthly is $6.99 a month, and Verisavo Pro is coming soon. See <a href="#quickstart">Plans</a>.</p></details>
  <details class="faq"><summary>Who is Verisavo for?</summary><p>Businesses, investors and institutions that need a clearer understanding of African markets: consumer goods brands, distributors and retailers, small and growing businesses, investors, consulting and research firms, and development and public institutions.</p></details>
  <details class="faq"><summary>Can Verisavo predict what will happen?</summary><p>No. Verisavo shows what the evidence supports, what is uncertain and what is still unknown. <a href="#market-simulation">Market Simulation</a> is designed to compare possible outcomes under stated assumptions, not to forecast with certainty.</p></details>
  <h2 id="glossary">Glossary</h2>
  <p>The terms Verisavo uses, in plain language.</p>
  <dl class="gloss">
   <dt>Connected intelligence</dt><dd>Understanding built by linking evidence across sources, places and time.</dd>
   <dt>Signal</dt><dd>The smallest meaningful sign that something is happening in a market.</dd>
   <dt>Evidence</dt><dd>A signal with its source, place, time, scope and method attached.</dd>
   <dt>Verification</dt><dd>Checks that evidence is reliable enough for its purpose.</dd>
   <dt>Intelligence states</dt><dd>The framework Verisavo uses to weigh evidence: Fact, Inference, Hypothesis, Assumption and Unknown.</dd>
   <dt>Intelligence Gap</dt><dd>A question the evidence cannot answer that could change a decision.</dd>
   <dt>Ground-Level Intelligence</dt><dd>Verified evidence gathered directly from markets.</dd>
   <dt>SavoScouts</dt><dd>Verisavo's contributor network that gathers Ground-Level Intelligence.</dd>
   <dt>Market Intelligence Network</dt><dd>The connected, time-aware structure that links market entities and relationships to their evidence.</dd>
   <dt>Market Memory</dt><dd>The record of how understanding of a market changes over time.</dd>
   <dt>Intelligence Assistant</dt><dd>The conversational way to ask questions and explore evidence.</dd>
   <dt>Client Intelligence</dt><dd>Private information that belongs to your organisation.</dd>
   <dt>Platform Intelligence</dt><dd>Evidence available across Verisavo under its governance rules.</dd>
  </dl>` },
];

document.addEventListener("click", (e) => { const b = e.target.closest(".ex-tab"); if (!b) return; const ex = b.closest(".ex"); const tabs = [...ex.querySelectorAll(".ex-tab")]; const k = tabs.indexOf(b); tabs.forEach((t, n) => t.setAttribute("aria-selected", String(n === k))); ex.querySelectorAll(".ex-p").forEach((p, n) => { p.hidden = n !== k; }); });
document.addEventListener("click", (e) => { const a = e.target.closest(".glance a[data-h]"); if (!a) return; const h = document.getElementById(a.dataset.h); if (h) { e.preventDefault(); h.scrollIntoView({ behavior: "smooth", block: "start" }); } });
const $ = (s, r = document) => r.querySelector(s);
const side = $("#side"), doc = $("#doc"), toc = $("#toc"), q = $("#q"), res = $("#results");
const byId = Object.fromEntries(PAGES.map(p => [p.id, p]));
const anchorOf = {}; // heading id -> page id
PAGES.forEach(p => { (p.body.match(/<h2 id="([^"]+)"/g) || []).forEach(m => { anchorOf[p.id + ":" + m.slice(8, -1)] = p.id; }); });

// sidebar
let g = "", html = "";
PAGES.forEach(p => { if (p.g !== g) { g = p.g; html += `<h4>${g}</h4>`; } html += `<a href="#${p.id}" data-id="${p.id}">${p.t}</a>`; });
html += `<h4>Verisavo</h4><a href="${document.querySelector(".tlink").getAttribute("href")}">← Back to the website</a>`;
side.innerHTML = html;

function render(id, anchor) {
  if (!byId[id] && ALIAS[id]) return render(ALIAS[id], id);
  const p = byId[id] || PAGES[0];
  const i = PAGES.indexOf(p), prev = PAGES[i - 1], next = PAGES[i + 1];
  // prefix heading ids with the page id so links stay unique
  const body = p.body.replace(/<h2 id="([^"]+)">([^<]+)/g, (m, a, t) => `<h2 id="${p.id}--${a}"><a class="h-anchor" href="#${p.id}">${t}</a>`);
  doc.innerHTML = `<p class="crumb">${p.crumb}</p><h1>${p.t}</h1>${body}
    <nav class="pager" aria-label="Previous and next">${prev ? `<a href="#${prev.id}"><small>Previous</small>${prev.t}</a>` : ""}${next ? `<a class="next" href="#${next.id}"><small>Next</small>${next.t}</a>` : ""}</nav>
    <div class="doc-foot"><div class="helpful"><span>Was this page helpful?</span><button type="button" aria-pressed="false">Yes</button><button type="button" aria-pressed="false">No</button></div><span>Verisavo Docs · early access</span></div>`;
  document.title = p.t + " · Verisavo Docs";
  side.querySelectorAll("a").forEach(a => a.toggleAttribute("aria-current", a.dataset.id === p.id) || a.dataset.id === p.id && a.setAttribute("aria-current", "page"));
  side.querySelectorAll("a").forEach(a => { if (a.dataset.id === p.id) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  const hs = [...doc.querySelectorAll("h2")];
  toc.innerHTML = hs.length ? `<h5>On this page</h5>` + hs.map(h => `<a href="#${p.id}" data-h="${h.id}">${h.textContent}</a>`).join("") : "";
  toc.querySelectorAll("a").forEach(a => a.addEventListener("click", e => { e.preventDefault(); document.getElementById(a.dataset.h).scrollIntoView({ behavior: "smooth" }); }));
  doc.querySelectorAll(".h-anchor").forEach(a => a.addEventListener("click", e => { e.preventDefault(); a.parentElement.scrollIntoView({ behavior: "smooth" }); }));
  doc.querySelectorAll("[data-copy]").forEach(b => b.addEventListener("click", () => {
    const t = b.closest(".prompt").querySelector(".prompt-b").textContent;
    const done = () => { b.textContent = "Copied"; setTimeout(() => b.textContent = "Copy", 1400); };
    try { navigator.clipboard.writeText(t).then(done, () => { const r = document.createRange(); r.selectNodeContents(b.closest(".prompt").querySelector(".prompt-b")); getSelection().removeAllRanges(); getSelection().addRange(r); }); } catch (e) {}
  }));
  doc.querySelectorAll(".helpful button").forEach(b => b.addEventListener("click", () => { doc.querySelectorAll(".helpful button").forEach(x => x.setAttribute("aria-pressed", String(x === b))); b.parentElement.firstElementChild.textContent = "Thanks for the feedback"; }));
  if (anchor && document.getElementById(p.id + "--" + anchor)) document.getElementById(p.id + "--" + anchor).scrollIntoView();
  else scrollTo({ top: 0 });
  spy(hs);
  document.body.classList.remove("nav-open"); $("#menu-btn").setAttribute("aria-expanded", "false");
}
let io;
function spy(hs) {
  if (io) io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) toc.querySelectorAll("a").forEach(a => a.classList.toggle("on", a.dataset.h === e.target.id)); }), { rootMargin: "-20% 0px -70% 0px" });
  hs.forEach(h => io.observe(h));
}
const route = () => render(location.hash.slice(1) || "introduction");
addEventListener("hashchange", route);
route();

// search
const idx = PAGES.map(p => { const tmp = document.createElement("div"); tmp.innerHTML = p.body; return { p, text: tmp.textContent.replace(/\s+/g, " "), heads: [...tmp.querySelectorAll("h2")].map(h => [h.id, h.textContent]) }; });
let sel = 0, hits = [];
function search() {
  const s = q.value.trim().toLowerCase();
  if (!s) { res.hidden = true; return; }
  hits = [];
  idx.forEach(({ p, text, heads }) => {
    if (p.t.toLowerCase().includes(s)) hits.push({ id: p.id, t: p.t, sub: p.g, w: 3 });
    heads.forEach(([hid, ht]) => { if (ht.toLowerCase().includes(s)) hits.push({ id: p.id, a: hid, t: ht, sub: p.t, w: 2 }); });
    const k = text.toLowerCase().indexOf(s);
    if (k > -1 && !hits.some(h => h.id === p.id)) hits.push({ id: p.id, t: p.t, sub: "…" + text.slice(Math.max(0, k - 30), k + 60) + "…", w: 1 });
  });
  hits.sort((a, b) => b.w - a.w); hits = hits.slice(0, 8); sel = 0;
  res.innerHTML = hits.length ? hits.map((h, i) => `<a href="#${h.id}" data-i="${i}" class="${i === 0 ? "on" : ""}"><span>${h.t}</span><small>${h.sub}</small></a>`).join("") : `<p>No results for “${q.value.replace(/</g, "&lt;")}”.</p>`;
  res.hidden = false;
  res.querySelectorAll("a").forEach(a => a.addEventListener("click", e => { e.preventDefault(); go(+a.dataset.i); }));
}
function go(i) { const h = hits[i]; if (!h) return; res.hidden = true; q.value = ""; q.blur(); if (location.hash.slice(1) === h.id) render(h.id, h.a); else { location.hash = h.id; if (h.a) setTimeout(() => render(h.id, h.a), 0); } }
q.addEventListener("input", search);
q.addEventListener("keydown", e => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + hits.length) % Math.max(1, hits.length); res.querySelectorAll("a").forEach((a, i) => a.classList.toggle("on", i === sel)); }
  if (e.key === "Enter") { e.preventDefault(); go(sel); }
  if (e.key === "Escape") { res.hidden = true; q.blur(); }
});
document.addEventListener("keydown", e => { if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); } });
document.addEventListener("click", e => { if (!e.target.closest(".search")) res.hidden = true; });

// theme and mobile nav
$("#theme").addEventListener("click", () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
});
$("#menu-btn").addEventListener("click", () => { const o = document.body.classList.toggle("nav-open"); $("#menu-btn").setAttribute("aria-expanded", String(o)); });
})();
</script>
<script>
/* phones: label table cells so wide tables can stack */
(function () {
  function label() { document.querySelectorAll(".tbl table:not(.stk)").forEach(function (t) { var hs = [].map.call(t.querySelectorAll("thead th"), function (h) { return h.textContent.trim(); }); if (hs.length < 3) return; t.classList.add("stk"); t.querySelectorAll("tbody tr").forEach(function (r) { [].forEach.call(r.children, function (c, i) { c.setAttribute("data-l", hs[i] || ""); }); }); }); }
  label(); new MutationObserver(label).observe(document.body, { childList: true, subtree: true });
})();
</script>
