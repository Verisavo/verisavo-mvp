<style>
/* Layout: three-column documentation shell. Sidebar of guides, a reading column near 68ch, and an on-this-page rail. */
:root {
  --bg: #FFFFFF; --bg2: #F6F8FC; --panel: #FFFFFF; --tint: #E3EBF8;
  --ink: #1F273F; --body: #3A4460; --sub: #5E6780; --line: rgba(31,39,63,.1); --line2: rgba(31,39,63,.18);
  --accent: #4362B2; --accent-soft: #E3EBF8; --accent-ink: #3A5292; --hl: #80AADC;
  --code: #F3F6FB; --warn: #8A5A12; --warn-bg: #FBF3E4;
  --serif: "Newsreader", "Iowan Old Style", Georgia, serif;
  --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --top: 60px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141a2b; --bg2: #1A2133; --panel: #1F273F; --tint: #263152;
  --ink: #EEF2FA; --body: #C7D2E6; --sub: #93A0BC; --line: rgba(206,221,241,.1); --line2: rgba(206,221,241,.2);
  --accent: #80AADC; --accent-soft: #263152; --accent-ink: #A8C6E8; --hl: #80AADC;
  --code: #1A2133; --warn: #F2C27A; --warn-bg: #2E2717; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #141a2b; --bg2: #1A2133; --panel: #1F273F; --tint: #263152;
  --ink: #EEF2FA; --body: #C7D2E6; --sub: #93A0BC; --line: rgba(206,221,241,.1); --line2: rgba(206,221,241,.2);
  --accent: #80AADC; --accent-soft: #263152; --accent-ink: #A8C6E8; --hl: #80AADC;
  --code: #1A2133; --warn: #F2C27A; --warn-bg: #2E2717; color-scheme: dark }
* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--top) + 24px); }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.65 var(--sans); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); }
a { color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 1px; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; height: var(--top); background: color-mix(in srgb, var(--bg) 92%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 16px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: baseline; gap: 8px; text-decoration: none; color: var(--ink); flex: none; }
.brand b { font: 600 1.12rem/1 var(--sans); letter-spacing: -.04em; }
.brand span { font: 500 .7rem/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--sub); }
.search { position: relative; flex: 0 1 360px; margin-left: 28px; }
.search input { width: 100%; height: 36px; border-radius: 9px; border: 1px solid var(--line2); background: var(--bg2); padding: 0 40px 0 34px; font-size: .88rem; }
.search input::placeholder { color: var(--sub); }
.search svg { position: absolute; left: 11px; top: 11px; width: 14px; height: 14px; color: var(--sub); }
.search kbd { position: absolute; right: 9px; top: 8px; font: 500 .68rem/1 var(--mono); color: var(--sub); border: 1px solid var(--line2); border-radius: 5px; padding: 3px 6px; }
.results { position: absolute; left: 0; right: 0; top: 42px; background: var(--panel); border: 1px solid var(--line2); border-radius: 12px; box-shadow: 0 20px 50px -20px rgba(15,20,35,.4); padding: 6px; max-height: 60vh; overflow-y: auto; }
.results a { display: grid; gap: 2px; padding: 9px 10px; border-radius: 8px; text-decoration: none; color: var(--ink); }
.results a small { color: var(--sub); font-size: .76rem; }
.results a.on, .results a:hover { background: var(--accent-soft); }
.results p { margin: 0; padding: 12px; color: var(--sub); font-size: .86rem; }
.top-r { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.tlink { font-size: .86rem; color: var(--body); text-decoration: none; padding: 8px 10px; border-radius: 8px; }
.tlink:hover { background: var(--bg2); }
.cta { font: 500 .84rem/1 var(--sans); background: var(--ink); color: var(--bg); text-decoration: none; padding: 10px 14px; border-radius: 8px; }
.icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid var(--line2); background: none; border-radius: 9px; cursor: pointer; color: var(--body); }
.icon-btn svg { width: 16px; height: 16px; }
.menu-btn { display: none; }
@media (max-width: 1000px) { .tlink { display: none; } }
@media (max-width: 1024px) { .menu-btn { display: grid; } .search { margin-left: 0; } .brand span { display: none; } .cta { display: none; } }

/* shell */
.shell { display: grid; grid-template-columns: 260px minmax(0, 1fr) 220px; max-width: 1440px; margin: 0 auto; }
@media (max-width: 1200px) { .shell { grid-template-columns: 240px minmax(0, 1fr); } .toc { display: none; } }
@media (max-width: 1024px) { .shell { grid-template-columns: minmax(0, 1fr); } }

/* sidebar */
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top)); height: calc(100vh - var(--top)); overflow-y: auto; padding: 26px 16px 40px max(18px, env(safe-area-inset-left, 0px)); border-right: 1px solid var(--line); scrollbar-width: thin; }
.side h4 { margin: 22px 0 8px 10px; font: 500 .68rem/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--sub); }
.side h4:first-child { margin-top: 0; }
.side a { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 7px; color: var(--body); text-decoration: none; font-size: .9rem; }
.side a:hover { background: var(--bg2); color: var(--ink); }
.side a[aria-current="page"] { background: var(--accent-soft); color: var(--accent-ink); font-weight: 500; }
.side a .tag { margin-left: auto; }
@media (max-width: 1024px) {
  .side { position: fixed; z-index: 25; top: calc(env(safe-area-inset-top, 0px) + var(--top)); left: 0; width: min(300px, 86vw); background: var(--bg); transform: translateX(-102%); transition: transform .25s; box-shadow: 20px 0 50px -30px rgba(0,0,0,.5); }
  body.nav-open .side { transform: none; }
}

/* article */
main { min-width: 0; padding: 40px max(18px, env(safe-area-inset-right, 0px)) 80px max(18px, env(safe-area-inset-left, 0px)); }
.doc { max-width: 740px; margin: 0 auto; }
.crumb { font: 500 .72rem/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 0 0 14px; }
.doc h1 { margin: 0; font: 400 clamp(2.1rem, 1.6rem + 1.6vw, 2.8rem)/1.1 var(--serif); letter-spacing: -.02em; text-wrap: balance; }
.doc .intro { font-size: 1.08rem; color: var(--body); margin: 14px 0 0; max-width: 64ch; }
.doc h2 { margin: 44px 0 12px; font: 400 1.6rem/1.2 var(--serif); letter-spacing: -.01em; text-wrap: balance; }
.doc h3 { margin: 30px 0 8px; font: 600 1.15rem/1.35 var(--sans); color: var(--ink); }
.doc p, .doc li { color: var(--body); max-width: 68ch; }
.doc p { margin: 12px 0; }
.doc ul, .doc ol { padding-left: 20px; margin: 12px 0; }
.doc li { margin: 6px 0; }
.doc strong { color: var(--ink); font-weight: 600; }
.doc hr { border: 0; border-top: 1px solid var(--line); margin: 40px 0; }
.doc code { font: 400 .86em/1.4 var(--mono); background: var(--code); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
.h-anchor { color: inherit; text-decoration: none; }
.h-anchor:hover::after { content: " #"; color: var(--sub); }

/* components */
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 22px 0; }
.cards.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.cardx { display: grid; gap: 6px; align-content: start; padding: 18px; border: 1px solid var(--line2); border-radius: 12px; background: var(--panel); text-decoration: none; color: var(--ink); transition: border-color .2s, transform .2s; }
a.cardx:hover { border-color: var(--accent); transform: translateY(-1px); }
.cardx .ic { width: 30px; height: 30px; border-radius: 8px; background: var(--accent-soft); color: var(--accent-ink); display: grid; place-items: center; margin-bottom: 6px; }
.cardx .ic svg { width: 16px; height: 16px; }
.cardx b { font-weight: 600; font-size: .96rem; }
.cardx span { font-size: .88rem; color: var(--sub); line-height: 1.5; }
@media (max-width: 640px) { .cards, .cards.three { grid-template-columns: 1fr; } }
.callout { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 12px; padding: 14px 16px; border-radius: 12px; margin: 20px 0; background: var(--accent-soft); color: var(--body); }
.callout svg { width: 18px; height: 18px; color: var(--accent-ink); margin-top: 3px; }
.callout p { margin: 0; color: var(--body); }
.callout b { color: var(--ink); }
.callout.warn { background: var(--warn-bg); } .callout.warn svg { color: var(--warn); }
.tag { display: inline-flex; align-items: center; font: 500 .6rem/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; padding: 4px 6px; border-radius: 999px; white-space: nowrap; vertical-align: 2px; }
.t-now { background: var(--accent-soft); color: var(--accent-ink); }
.t-dev { box-shadow: inset 0 0 0 1px var(--line2); color: var(--sub); }
.t-plan { box-shadow: inset 0 0 0 1px var(--line2); color: var(--sub); border: 0; outline: 1px dashed var(--line2); outline-offset: -1px; }
.steps { list-style: none; padding: 0 !important; margin: 22px 0 !important; counter-reset: s; display: grid; }
.steps > li { counter-increment: s; position: relative; padding: 0 0 22px 44px; margin: 0; max-width: none; }
.steps > li::before { content: counter(s); position: absolute; left: 0; top: 0; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 500 .8rem/1 var(--mono); background: var(--ink); color: var(--bg); }
.steps > li::after { content: ""; position: absolute; left: 13.5px; top: 32px; bottom: 4px; width: 1px; background: var(--line2); }
.steps > li:last-child::after { display: none; }
.steps > li > b { display: block; color: var(--ink); font-weight: 600; margin-bottom: 2px; }
.steps > li > p { margin: 4px 0; }
.tbl { overflow-x: auto; margin: 20px 0; border: 1px solid var(--line); border-radius: 12px; }
.tbl table { width: 100%; border-collapse: collapse; font-size: .88rem; min-width: 520px; }
.tbl th, .tbl td { text-align: left; vertical-align: top; padding: 11px 14px; border-top: 1px solid var(--line); color: var(--body); }
.tbl thead th { border-top: 0; background: var(--bg2); font: 500 .66rem/1.2 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--sub); }
.tbl tbody th { color: var(--ink); font-weight: 600; white-space: nowrap; }
.prompt { margin: 16px 0; border: 1px solid var(--line2); border-radius: 12px; overflow: hidden; background: var(--panel); }
.prompt-h { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--bg2); font: 500 .68rem/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--sub); }
.prompt-h button { border: 0; background: none; cursor: pointer; font: inherit; color: var(--accent-ink); letter-spacing: .08em; padding: 4px 6px; border-radius: 5px; }
.prompt-h button:hover { background: var(--accent-soft); }
.prompt-b { padding: 14px 16px; font: 400 .94rem/1.55 var(--sans); color: var(--ink); }
.figure { margin: 24px 0; padding: 22px; border-radius: 14px; background: var(--bg2); border: 1px solid var(--line); overflow-x: auto; }
.figure svg { display: block; width: 100%; min-width: 720px; height: auto; }
.figure figcaption { margin-top: 12px; font-size: .8rem; color: var(--sub); }
.flow-box { fill: var(--panel); stroke: var(--line2); }
.flow-dash { stroke-dasharray: 5 4; stroke: var(--hl); }
.flow-hi { fill: var(--ink); }
.flow-t { font: 600 13px var(--sans); fill: var(--ink); letter-spacing: -.01em; }
.flow-th { font: 600 13px var(--sans); fill: var(--bg); letter-spacing: -.01em; }
.flow-s { font: 400 11px var(--sans); fill: var(--sub); }
.flow-sh { font: 400 11px var(--sans); fill: var(--hl); }
.flow-n { font: 500 9.5px var(--mono); fill: var(--hl); letter-spacing: .08em; }
.flow-nh { font: 500 9.5px var(--mono); fill: var(--hl); letter-spacing: .08em; }
.flow-k { font: 500 9.5px var(--mono); fill: var(--sub); letter-spacing: .06em; text-transform: uppercase; }
.flow-l { stroke: var(--hl); stroke-width: 1.4; fill: none; }
.flow-d { stroke-dasharray: 4 4; }
.flow-ah { fill: var(--hl); }
.states { display: grid; gap: 10px; margin: 20px 0; }
.state { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 16px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
.state p { margin: 0; }
.state .chip { justify-self: start; align-self: start; font: 500 .66rem/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; padding: 6px 9px; border-radius: 999px; }
.c-fact { background: var(--ink); color: var(--bg); }
.c-inf { background: var(--accent-soft); color: var(--accent-ink); }
.c-hyp { box-shadow: inset 0 0 0 1px var(--hl); color: var(--accent-ink); }
.c-ass { box-shadow: inset 0 0 0 1px var(--line2); color: var(--sub); }
.c-unk { outline: 1px dashed var(--accent); outline-offset: -1px; color: var(--accent-ink); }
@media (max-width: 560px) { .state { grid-template-columns: 1fr; gap: 8px; } }
details.faq { border-top: 1px solid var(--line); }
details.faq:last-of-type { border-bottom: 1px solid var(--line); }
details.faq summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 12px; padding: 16px 0; font-weight: 500; color: var(--ink); }
details.faq summary::-webkit-details-marker { display: none; }
details.faq summary::after { content: "+"; color: var(--sub); font-size: 1.2rem; line-height: 1; transition: transform .2s; }
details.faq[open] summary::after { transform: rotate(45deg); }
details.faq p { margin: 0 0 16px; }
dl.gloss { display: grid; grid-template-columns: minmax(0, 200px) minmax(0, 1fr); gap: 0; margin: 20px 0; border-top: 1px solid var(--line); }
dl.gloss dt, dl.gloss dd { margin: 0; padding: 14px 0; border-bottom: 1px solid var(--line); }
dl.gloss dt { font-weight: 600; color: var(--ink); padding-right: 16px; }
dl.gloss dd { color: var(--body); }
@media (max-width: 560px) { dl.gloss { grid-template-columns: 1fr; } dl.gloss dt { border-bottom: 0; padding-bottom: 2px; } dl.gloss dd { padding-top: 0; } }

/* page footer */
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 56px; }
.pager a { display: grid; gap: 4px; padding: 14px 16px; border: 1px solid var(--line2); border-radius: 12px; text-decoration: none; color: var(--ink); }
.pager a:hover { border-color: var(--accent); }
.pager a small { font: 500 .66rem/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--sub); }
.pager a.next { text-align: right; grid-column: 2; }
.doc-foot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--line); font-size: .8rem; color: var(--sub); }
.helpful { display: flex; align-items: center; gap: 8px; }
.helpful button { border: 1px solid var(--line2); background: none; border-radius: 7px; padding: 4px 10px; cursor: pointer; font-size: .8rem; color: var(--body); }
.helpful button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); border-color: transparent; }

/* toc */
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top)); height: calc(100vh - var(--top)); overflow-y: auto; padding: 40px max(18px, env(safe-area-inset-right, 0px)) 40px 8px; }
.toc h5 { margin: 0 0 10px; font: 500 .68rem/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--sub); }
.toc a { display: block; padding: 5px 0 5px 12px; border-left: 1px solid var(--line2); color: var(--sub); text-decoration: none; font-size: .84rem; line-height: 1.35; }
.toc a:hover { color: var(--ink); }
.toc a.on { color: var(--accent-ink); border-left-color: var(--accent); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
/* >>> type */

:root { --display: "Inter", "Geist", "Helvetica Neue", Arial, sans-serif; --serif: var(--display); }
.doc h1 { font-family: var(--display) !important; font-weight: 600 !important; letter-spacing: -.005em !important; font-size: clamp(2.6rem, 1.9rem + 2vw, 3.4rem) !important; line-height: 1 !important; }
.doc h2 { font-family: var(--display) !important; font-weight: 600 !important; letter-spacing: -.005em !important; font-size: 2rem !important; line-height: 1.05 !important; }
:root { --container: 1500px; --gutter: clamp(20px, 3vw, 32px); --edge: max(var(--gutter), calc((100vw - var(--container)) / 2 + var(--gutter))); --measure: 68ch; }
.shell { max-width: var(--container) !important; padding-inline: var(--gutter); box-sizing: border-box; }
@media (min-width: 1201px) { .shell { grid-template-columns: 260px minmax(0, 1fr) 240px; } }
.top { padding-inline: var(--edge) !important; }
.doc { max-width: 820px !important; }
.brand b { font-size: 1.4rem !important; }
.tag { font: 600 .75rem/1 var(--sans) !important; letter-spacing: 0 !important; text-transform: none !important; }
.flow-t, .flow-th { font-family: var(--sans); }
.flow-n, .flow-nh { font: 600 13px var(--display) !important; letter-spacing: .02em !important; }
.side h4 { font-family: var(--sans) !important; text-transform: none !important; letter-spacing: 0 !important; font-size: 0.884rem !important; font-weight: 500 !important; line-height: 1.35 !important; }
.crumb { font-family: var(--sans) !important; text-transform: none !important; letter-spacing: 0 !important; font-size: 0.9rem !important; font-weight: 500 !important; line-height: 1.35 !important; }
.tbl thead th { font-family: var(--sans) !important; text-transform: none !important; letter-spacing: 0 !important; font-size: 0.858rem !important; font-weight: 500 !important; line-height: 1.35 !important; }
.prompt-h { font-family: var(--sans) !important; text-transform: none !important; letter-spacing: 0 !important; font-size: 0.884rem !important; font-weight: 500 !important; line-height: 1.35 !important; }
.pager a small { font-family: var(--sans) !important; text-transform: none !important; letter-spacing: 0 !important; font-size: 0.858rem !important; font-weight: 500 !important; line-height: 1.35 !important; }
.toc h5 { font-family: var(--sans) !important; text-transform: none !important; letter-spacing: 0 !important; font-size: 0.884rem !important; font-weight: 500 !important; line-height: 1.35 !important; }
/* <<< type */
.tbl tr.hl td, .tbl tr.hl th { background: var(--accent-soft); font-weight: 600; }
.st-term { font: 600 1.05rem/1.3 var(--sans); color: var(--ink); }
.ig-l { stroke: var(--line2); stroke-width: 1.6; fill: none; }
.ig-d { stroke-dasharray: 4 4; }
.gf-k { font: 600 13px var(--sans); letter-spacing: .06em; fill: var(--hl); }
.gf-t { font: 600 19px var(--sans); fill: var(--ink); letter-spacing: -.01em; }
.gf-s { font: 400 15px var(--sans); fill: var(--sub); }
.gf-kh { font: 600 13px var(--sans); letter-spacing: .06em; fill: var(--hl); }
.gf-th { font: 600 21px var(--sans); fill: var(--bg); letter-spacing: -.01em; }
.gf-sh { font: 400 15px var(--sans); fill: var(--hl); }

@media (max-width: 760px) { .gfig { overflow: visible; padding: 14px; } .gfig .gf-d { display: none; } .gfig .gf-m { display: block; min-width: 0; max-width: 420px; margin: 0 auto; } }

/* evidence-style examples */
.doc .glance { list-style: none; margin: 16px 0 8px; padding: 0 !important; max-width: none; border-top: 1px solid var(--line); }
.doc .glance li { margin: 0; display: grid; grid-template-columns: minmax(170px, 230px) minmax(0, 1fr); gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.glance a { font-weight: 600; color: var(--accent-ink); text-decoration: none; }

  <p class="intro">Verisavo is a connected intelligence layer for African markets. It connects fragmented market evidence so your team can see what is happening, why, what is still unknown and what it could mean for the decision ahead.</p>

  <h2 id="problem">The problem it solves</h2>
  <p>The information you need to understand a market usually exists. It sits in your company data, public records, digital platforms, research reports, field notes and the knowledge of distributors and traders. It rarely adds up to one picture, and it is hard to tell which pieces are reliable, current or relevant to the question in front of you.</p>
  <p>More data does not fix this on its own. Verisavo connects evidence, keeps its context and is honest about what it cannot yet answer.</p>
  <h2 id="what-it-does">What Verisavo does</h2>

  <p class="intro">Get early access, ask your first market question and learn to read the answer. This takes about five minutes.</p>
  <h2 id="access">Get early access</h2>

  <h2 id="first-question">Ask your first question</h2>
  <p>Start with a decision you are facing, and name the place and time where you can.</p>
  ${prompt("Why are enquiries for our solar kits rising in Lugbe, Abuja, while conversion has fallen over the last quarter?")}
  <h2 id="read-answer">Read the answer</h2>
  <p>Answers are being built to show you four things. Some are still in development, as the <a href="#introduction">status table</a> shows:</p>
  <ul><li><strong>What the evidence supports</strong>, separated from what is inferred or still <a href="#intelligence-states">unknown</a>.</li><li><strong>Where it comes from</strong>: the source, place, time and method behind each point.</li><li><strong>What conflicts</strong>: evidence that disagrees stays visible rather than being dropped.</li><li><strong>What is still unknown</strong>: the questions the evidence cannot answer yet.</li></ul>
  <h2 id="plans">Early access plans</h2>
  <div class="tbl"><table><thead><tr><th>Plan</th><th>Price</th><th>What you get</th></tr></thead><tbody>
   <tr><th>Free</th><td>$0</td><td>Your first 5 questions, to see how Verisavo works on your market.</td></tr>
   <tr><th>Verisavo Monthly</th><td>$6.99 a month</td><td>Ongoing access to the Verisavo Intelligence Assistant.</td></tr>
   <tr><th>Verisavo Pro</th><td>Coming soon</td><td>For teams with deeper needs. Join the waitlist from the pricing page.</td></tr>
  </tbody></table></div>
  <h2 id="next">Next steps</h2>
  <div class="cards">${card("asking-questions","chat","Start with a market question","How to frame questions that lead to useful answers.")}${card("intelligence-gaps","info","Intelligence Gaps","What to do when an answer says Unknown.")}</div>` },
 { g: "Get started", id: "how-it-works", t: "How it works", ic: "layers", crumb: "Get started", body: `
  <p class="intro">Five steps turn scattered market information into connected intelligence, built on seven layers that run from Africa’s market reality to the decision you make.</p>
  <h2 id="how-it-works">How it works</h2>
  <p>Verisavo turns scattered observations about a market into connected, evidence-grounded understanding, and keeps that understanding up to date. It does this in five steps, from fragmented information to market intelligence.</p>
  <h3 id="five-steps">The five steps</h3>
  <ol class="steps">
   <li><b>Capture: Bring market information together.</b><p>Verisavo gathers signals from company data, public records, digital platforms, market research and local communities. When critical information is missing, SavoScouts are being set up to gather fresh intelligence directly from the ground.</p></li>
   <li><b>Verify: Establish what can be trusted.</b><p>Verisavo is designed to assess evidence for its source, location, time, relevance and reliability, compare information across sources, flag inconsistencies and make uncertainty visible.</p></li>
   <li><b>Connect: Reveal the relationships behind market change.</b><p>Verisavo connects evidence across businesses, products, customers, competitors, prices, locations and time. Its Market Intelligence Network is built to reveal patterns and relationships, linking important findings to supporting evidence.</p></li>
   <li><b>Evolve: Build intelligence that grows with the market.</b><p>Market Memory is designed to preserve signals, relationships, findings and supporting evidence, so that as new information emerges Verisavo can track changes, update its understanding and revisit previous conclusions.</p></li>
   <li><b>Understand: Turn connected intelligence into clearer decisions.</b><p>The Verisavo Intelligence Assistant uses connected evidence to answer market questions, explore possible explanations, identify Intelligence Gaps and assess decision options. Findings remain traceable, uncertainties are stated and decisions stay with the business.</p></li>
  </ol>
  ${FLOW}
  <h3 id="layers">The layers</h3>
  <div class="tbl"><table><thead><tr><th>Layer</th><th>What it does</th></tr></thead><tbody>
   <tr><th>Market reality</th><td>The real market: businesses, products, customers, prices, routes, policies and how they change.</td></tr>
   <tr><th><a href="#signals">Signals</a></th><td>The smallest meaningful sign that something is happening, such as a price change or a stockout.</td></tr>
   <tr><th><a href="#evidence">Evidence</a></th><td>A signal with its context attached: source, place, time, scope and method.</td></tr>
   <tr><th><a href="#verification">Verification</a></th><td>Checks whether evidence is reliable enough for the purpose it will serve.</td></tr>
   <tr><th><a href="#intelligence-graph">Market Intelligence Network</a></th><td>Links evidence across businesses, products, places, time and earlier findings.</td></tr>
   <tr><th><a href="#market-memory">Market Memory</a></th><td>Records what was known, what changed and which evidence changed it.</td></tr>
   <tr><th><a href="#asking-questions">Intelligence Assistant</a></th><td>The conversational way to question all of the above.</td></tr>
   <tr><th>Your decision</th><td>Made by your team, with the evidence and uncertainty in view.</td></tr>
  </tbody></table></div>
  <p>These layers describe how evidence moves inside Verisavo. For how Verisavo relates to other sources of market intelligence, see <a href="#seven-layers">The seven layers</a>.</p>
  <h3 id="principles">Principles</h3>
  <ul><li><strong>Evidence before assertion.</strong> A fluent answer is not the same as a supported one.</li><li><strong>Context before conclusion.</strong> A price in one market in March says little about another market in May.</li><li><strong>Unknown is a valid answer.</strong> A named gap is more useful than a confident guess.</li><li><strong>Markets change.</strong> Understanding is updated, not filed away.</li></ul>
  <h2 id="seven-layers">The seven layers</h2>
  <p>Africa is not a continent without information. Much of what is needed to understand its markets exists, but in incomplete chapters: some in public records, others in research reports, digital platforms, company systems and the everyday experience of people on the ground. Each reveals something about the market. None tells the whole story on its own.</p>
  <h3 id="layers">Seven layers of market intelligence</h3>
  <p>One way to explain why Verisavo exists is to describe market intelligence as seven layers. The first six are sources and tools that each see part of the market. The seventh is the layer that connects them.</p>
  <div class="tbl"><table><thead><tr><th>Layer</th><th>Intelligence</th><th>What it reveals</th><th>The missing chapter</th></tr></thead><tbody>
   <tr><td>01</td><th>Public Intelligence</th><td>Government records, economic indicators, regulations and demographics.</td><td>Records can be outdated, incomplete or geographically limited.</td></tr><tr><td>02</td><th>Research Intelligence</th><td>Industry reports, surveys, market studies and sector analysis.</td><td>Research captures particular moments, leaving changes between studies unexplained.</td></tr><tr><td>03</td><th>Digital Intelligence</th><td>Search trends, social conversations, online marketplaces and digital activity.</td><td>Much of Africa's offline economic activity leaves limited digital traces.</td></tr><tr><td>04</td><th>Business Intelligence</th><td>Sales, customers, inventory, distribution and operational performance.</td><td>Businesses see what happens internally but not always why the surrounding market changes.</td></tr><tr><td>05</td><th>Ground-Level Intelligence</th><td>Observations from retailers, consumers, distributors and local communities.</td><td>Valuable knowledge often remains informal, fragmented or unverified.</td></tr><tr><td>06</td><th>Artificial Intelligence</th><td>Analyses available information, recognises patterns and generates explanations.</td><td>AI can reason over available information but cannot reliably recover missing facts without new evidence.</td></tr><tr class="hl"><td>07</td><th>Connected Intelligence (Verisavo)</th><td>Connects, verifies and relates information across the other layers, keeps Market Memory and identifies gaps for further investigation.</td><td>Brings the fragmented chapters together into an evolving, evidence-grounded understanding of African markets.</td></tr>
  </tbody></table></div>
  ${note("This is a storytelling framework Verisavo uses to explain its role. It is not an established industry classification, and it does not claim that other systems cannot combine these sources.")}
  <h3 id="chapters">Africa's Incomplete Chapters</h3>
  <p>Imagine trying to understand a book with missing chapters. You can follow parts of the story, but important events, connections and explanations are missing. Without them, it becomes difficult to understand what really happened, why it happened or what might happen next.</p>
  <p>That is the challenge of understanding many African markets.</p>
  <p>A government report may show population growth but not how household buying is changing. A company's sales records may show falling revenue but not the competitor winning customers nearby. A digital platform may capture online conversation but miss the transactions in neighbourhood shops and open markets. Even AI is limited by the information it can reach and the evidence available to support its conclusions.</p>
  <p>The problem is not only missing data. It is missing connections, incomplete evidence and unanswered questions.</p>
  <h3 id="seventh">The seventh layer</h3>
  <p>Verisavo is not another chapter of market information. It connects public information, research, digital signals, company data and verified Ground-Level Intelligence. It shows how they relate, makes uncertainty visible, names what is missing and keeps <a href="#market-memory">Market Memory</a> as new evidence arrives.</p>
  <p>The result is not a claim to know everything about African markets. It is a system designed to build a clearer, more connected understanding of them, one verified piece of evidence at a time.</p>` },
 { g: "Get started", id: "technical-overview", t: "Technical overview", ic: "graph", crumb: "Get started", body: `
  <p class="intro">How Verisavo is designed to work underneath: the layers, where the evidence comes from, and what becomes more valuable as the platform is used. Written for technical readers and investors.</p>
  ${note("Parts of this are in early access and parts are still in development. Each layer below carries its current status, and the <a href=\"#roadmap\">Roadmap</a> shows what comes next.")}
  <h2 id="layers">Architecture at a glance</h2>
  <div class="tbl"><table><thead><tr><th>Layer</th><th>What it does</th><th>Status</th></tr></thead><tbody>
   <tr><th>Capture</th><td>Brings in signals from company data, public records, digital platforms, research and Ground-Level Intelligence.</td><td>${EA}</td></tr>
   <tr><th>Evidence</th><td>Keeps each signal with its source, place, time, scope, method and reliability, so context travels with it.</td><td>${DEV}</td></tr>
   <tr><th>Verification</th><td>Checks whether evidence is reliable enough for its purpose: cross-source comparison, contributor reliability and contradiction detection.</td><td>${DEV}</td></tr>
   <tr><th>Market Intelligence Network</th><td>Links businesses, products, customers, prices, places and events to the evidence behind each link.</td><td>${DEV}</td></tr>
   <tr><th>Market Memory</th><td>Records how understanding changes: what was known, what changed and which evidence changed it.</td><td>${DEV}</td></tr>
   <tr><th>Intelligence Assistant</th><td>The conversational way in: ask questions, explore evidence, compare markets and see what is unknown. On WhatsApp today; the web app is in development.</td><td>${EA}</td></tr>
   <tr><th>Market Simulation</th><td>Explores possible outcomes under stated assumptions.</td><td>${PLAN}</td></tr>
  </tbody></table></div>
  <h2 id="sources">Where the evidence comes from</h2>
  <p>Verisavo draws on five kinds of source. Each is used within its own terms, and each keeps its provenance so a finding can be traced back to where it came from.</p>
  <ul>
   <li><strong>Company data</strong>, shared by the customer, such as orders, distributor records and sales exports. It remains Client Intelligence and is never used to answer anyone else.</li>
   <li><strong>Public records</strong>, such as official statistics, registries, regulatory notices and policy announcements.</li>
   <li><strong>Digital platforms</strong>, such as publicly available listings, prices, reviews and online activity.</li>
   <li><strong>Research</strong>, such as published market studies and reports, used within the terms they are published under.</li>
   <li><strong>Ground-Level Intelligence</strong>, gathered by <a href="#savoscouts">SavoScouts</a> when the other sources cannot answer a question that matters. ${DEV}</li>
  </ul>
  <h2 id="compounds">What becomes more valuable with use</h2>
  <p>A general AI assistant starts again with every question. Verisavo is designed so that understanding accumulates, market by market.</p>
  <div class="tbl"><table><thead><tr><th>Asset</th><th>Why it compounds</th></tr></thead><tbody>
   <tr><th>Connected evidence</th><td>Each question adds evidence linked to places, products and time. The next question about the same market starts from more.</td></tr>
   <tr><th>Market Memory</th><td>A record of what changed and why builds up over months. It cannot be recreated later by collecting more data today.</td></tr>
   <tr><th>Ground-Level Intelligence</th><td>Evidence from shops, markets and routes that leave few digital traces. Much of it does not exist anywhere else.</td></tr>
   <tr><th>Contributor reliability</th><td>Each SavoScout investigation adds to a track record, which improves how future evidence is weighed.</td></tr>
  </tbody></table></div>
  ${note("These effects depend on use and coverage. They are designed into the architecture and build up as more questions are asked in each market.")}
  <h2 id="principles">Design principles</h2>
  <ul><li><strong>Evidence before assertion.</strong> A conclusion is only as strong as the evidence behind it.</li><li><strong>Unknown is a valid answer.</strong> When the evidence cannot answer a question, Verisavo says so and names the gap.</li><li><strong>Client data stays private.</strong> See <a href="#privacy">Privacy and responsible use</a>.</li><li><strong>Decisions stay human.</strong> Verisavo brings evidence and uncertainty closer to the decision. People make it.</li></ul>` },
 { g: "Core concepts", id: "evidence", t: "Signals and evidence", ic: "file", crumb: "Core concepts", body: `
  <p class="intro">A signal is the first sign that something is happening. It becomes evidence when its context travels with it. This page covers both, and the five kinds of source Verisavo draws on.</p>
  <h2 id="signals">Signals</h2>
  <p>A signal is the smallest meaningful sign that something is happening in a market. One signal is a starting point, never a conclusion.</p>
  <h3 id="examples">Examples</h3>
  <ul><li>A price rises 8% across three retailers</li><li>A product is missing from shelves on one street</li><li>A competitor appears at two market stalls</li><li>A retailer switches supplier</li><li>Deliveries on a route arrive a day late</li><li>Footfall changes on market days</li></ul>
  <h3 id="one-signal">Why one signal is not enough</h3>
  <p>An empty shelf could mean rising demand, a supply problem, a retailer short of cash, a changed delivery route or a shop that switched to a competitor. Each explanation calls for a different response. Verisavo treats the signal as a question to check, then looks for what else would be true under each explanation.</p>
  ${SIGFIG}
  ${note("Record the context with every observation: exactly where, when, how many places were checked and by whom. Three empty shelves out of three is a different finding from three out of thirty.")}
  <h2 id="evidence">Evidence</h2>
  <p>A <a href="#signals">signal</a> becomes evidence when its context travels with it: where it came from, where and when it applies, how much of the market it covers and how it was gathered. Without that context, a data point can mislead as easily as it informs.</p>
  <p>No source is trusted or dismissed because of what kind it is. A company report can be out of date, and a single shelf check can be the most current evidence available. Each piece is judged on its own context.</p>
  <h3 id="context">What every piece of evidence carries</h3>
  <div class="tbl"><table><thead><tr><th>Field</th><th>Example</th></tr></thead><tbody>
   <tr><th>Source</th><td>Shelf check by a SavoScout</td></tr><tr><th>Place</th><td>Surulere market, Lagos</td></tr><tr><th>Time</th><td>Tuesday, 08:40</td></tr><tr><th>Scope</th><td>9 kiosks near the main bus park</td></tr><tr><th>Method</th><td>In-person observation, geo-tagged photo</td></tr><tr><th>Reliability</th><td>Assessed through <a href="#verification">verification</a></td></tr>
  </tbody></table></div>
  <h3 id="scope">Why scope matters</h3>
  <p>Three empty shelves out of three is a different finding from three out of thirty. A price observed in Lagos says nothing on its own about Kano or Accra, and a reading from March may not describe May. Evidence keeps its scope so that conclusions are never stretched beyond the places, times and groups it actually covers.</p>
  <h3 id="contradicting">Evidence that disagrees</h3>
  <p>Evidence against a conclusion is kept alongside evidence for it. A finding is only as strong as its answer to the evidence that points the other way.</p>
  <h3 id="your-data">Your company data</h3>
  <p>Evidence you bring is <a href="#privacy">Client Intelligence</a>. It is used to answer your questions and stays private, protected and under your control. It never becomes visible to other customers.</p>
  <h2 id="evidence-sources">Evidence sources</h2>
  <p>Verisavo draws evidence from five kinds of source. Each one sees part of a market and none of them sees all of it. This page shows what each source contributes, the context kept with it and what to watch for.</p>
  <h3 id="at-a-glance">At a glance</h3>
  <ul class="glance"><li><a href="#evidence-sources" data-h="company-data">Company data</a><span>What your own sales, orders and distributor reports show.</span></li><li><a href="#evidence-sources" data-h="public-records">Public records</a><span>Registrations, trade statistics, regulation and policy.</span></li><li><a href="#evidence-sources" data-h="digital-platforms">Digital platforms</a><span>Online listings, prices and reviews.</span></li><li><a href="#evidence-sources" data-h="research">Research</a><span>Surveys, studies and industry reports.</span></li><li><a href="#evidence-sources" data-h="ground-level">Ground-Level Intelligence</a><span>Shelf checks and observations gathered by SavoScouts.</span></li></ul>
  <h3 id="company-data">Company data</h3>
  <p>Your own records are often the most precise evidence about what happened to your business. They rarely explain why it happened, and they only see the outlets and customers you already reach.</p>
  <div class="ex"><div class="ex-h" role="tablist"><button type="button" class="ex-tab" role="tab" aria-selected="true">Preview</button><button type="button" class="ex-tab" role="tab" aria-selected="false">Context kept</button><span class="ex-l">Illustrative example</span></div><div class="ex-p" role="tabpanel"><div class="evc"><span class="evc-k">Company data</span><p class="evc-s">Orders for the 1-litre pack from Kano distributors fell 18% between July and September.</p><dl class="evc-m"><div><dt>Source</dt><dd>Order export you uploaded</dd></div><div><dt>Place</dt><dd>Kano State</dd></div><div><dt>Time</dt><dd>July to September</dd></div><div><dt>Scope</dt><dd>14 distributors</dd></div><div><dt>Method</dt><dd>Your company records</dd></div></dl></div></div><div class="ex-p" role="tabpanel" hidden><div class="tbl"><table><thead><tr><th>Field</th><th>Value kept with this evidence</th></tr></thead><tbody><tr><th>Source</th><td>Order export you uploaded</td></tr><tr><th>Place</th><td>Kano State</td></tr><tr><th>Time</th><td>July to September</td></tr><tr><th>Scope</th><td>14 distributors</td></tr><tr><th>Method</th><td>Your company records</td></tr></tbody></table></div></div></div>
  <dl class="pst"><div><dt>Good for</dt><dd>Exactly what changed in your own sales, orders and coverage.</dd></div><div><dt>Watch for</dt><dd>It shows outcomes, not causes, and says nothing about outlets you do not serve.</dd></div></dl>
  <h3 id="public-records">Public records</h3>
  <p>Public records set the context a market operates in: who is registered to trade, what rules apply and what official statistics report. They tend to be authoritative but slow, and are often reported nationally rather than city by city.</p>
  <div class="ex"><div class="ex-h" role="tablist"><button type="button" class="ex-tab" role="tab" aria-selected="true">Preview</button><button type="button" class="ex-tab" role="tab" aria-selected="false">Context kept</button><span class="ex-l">Illustrative example</span></div><div class="ex-p" role="tabpanel"><div class="evc"><span class="evc-k">Public records</span><p class="evc-s">A new cooking oil brand completed product registration with the national regulator in June.</p><dl class="evc-m"><div><dt>Source</dt><dd>Public register</dd></div><div><dt>Place</dt><dd>Nigeria (national)</dd></div><div><dt>Time</dt><dd>June</dd></div><div><dt>Scope</dt><dd>One brand, one product line</dd></div><div><dt>Method</dt><dd>Official record</dd></div></dl></div></div><div class="ex-p" role="tabpanel" hidden><div class="tbl"><table><thead><tr><th>Field</th><th>Value kept with this evidence</th></tr></thead><tbody><tr><th>Source</th><td>Public register</td></tr><tr><th>Place</th><td>Nigeria (national)</td></tr><tr><th>Time</th><td>June</td></tr><tr><th>Scope</th><td>One brand, one product line</td></tr><tr><th>Method</th><td>Official record</td></tr></tbody></table></div></div></div>
  <dl class="pst"><div><dt>Good for</dt><dd>Rules, registrations and official figures that frame a decision.</dd></div><div><dt>Watch for</dt><dd>Time lags, and national figures that hide differences between cities.</dd></div></dl>
  <h3 id="digital-platforms">Digital platforms</h3>
  <p>Online listings and reviews are current and easy to compare, which makes them useful for prices and new products. They show the part of the market that trades online, and that part can look very different from shops and open markets.</p>
  <div class="ex"><div class="ex-h" role="tablist"><button type="button" class="ex-tab" role="tab" aria-selected="true">Preview</button><button type="button" class="ex-tab" role="tab" aria-selected="false">Context kept</button><span class="ex-l">Illustrative example</span></div><div class="ex-p" role="tabpanel"><div class="evc"><span class="evc-k">Digital platforms</span><p class="evc-s">A rival 750ml pack is listed about 15% below the 1-litre price, per litre, on two online wholesale platforms.</p><dl class="evc-m"><div><dt>Source</dt><dd>Two wholesale platforms</dd></div><div><dt>Place</dt><dd>Kano</dd></div><div><dt>Time</dt><dd>2 October</dd></div><div><dt>Scope</dt><dd>11 listings</dd></div><div><dt>Method</dt><dd>Captured listings</dd></div></dl></div></div><div class="ex-p" role="tabpanel" hidden><div class="tbl"><table><thead><tr><th>Field</th><th>Value kept with this evidence</th></tr></thead><tbody><tr><th>Source</th><td>Two wholesale platforms</td></tr><tr><th>Place</th><td>Kano</td></tr><tr><th>Time</th><td>2 October</td></tr><tr><th>Scope</th><td>11 listings</td></tr><tr><th>Method</th><td>Captured listings</td></tr></tbody></table></div></div></div>
  <dl class="pst"><div><dt>Good for</dt><dd>Current prices, pack sizes and new products.</dd></div><div><dt>Watch for</dt><dd>Online prices may not match what shoppers pay in kiosks and markets.</dd></div></dl>
  <h3 id="research">Research</h3>
  <p>Research explains behaviour across a defined group, such as how households buy or why they switch. Its value depends on when the fieldwork was done and whether the people studied match the market you are asking about.</p>
  <div class="ex"><div class="ex-h" role="tablist"><button type="button" class="ex-tab" role="tab" aria-selected="true">Preview</button><button type="button" class="ex-tab" role="tab" aria-selected="false">Context kept</button><span class="ex-l">Illustrative example</span></div><div class="ex-p" role="tabpanel"><div class="evc"><span class="evc-k">Research</span><p class="evc-s">A household survey reports that lower-income households in northern Nigeria mostly buy cooking oil in sachets and small packs.</p><dl class="evc-m"><div><dt>Source</dt><dd>Third-party household survey</dd></div><div><dt>Place</dt><dd>Northern Nigeria</dd></div><div><dt>Time</dt><dd>Fieldwork in 2025</dd></div><div><dt>Scope</dt><dd>Survey sample, lower-income households</dd></div><div><dt>Method</dt><dd>Structured interviews</dd></div></dl></div></div><div class="ex-p" role="tabpanel" hidden><div class="tbl"><table><thead><tr><th>Field</th><th>Value kept with this evidence</th></tr></thead><tbody><tr><th>Source</th><td>Third-party household survey</td></tr><tr><th>Place</th><td>Northern Nigeria</td></tr><tr><th>Time</th><td>Fieldwork in 2025</td></tr><tr><th>Scope</th><td>Survey sample, lower-income households</td></tr><tr><th>Method</th><td>Structured interviews</td></tr></tbody></table></div></div></div>
  <dl class="pst"><div><dt>Good for</dt><dd>Behaviour and reasons across a defined population.</dd></div><div><dt>Watch for</dt><dd>Fieldwork that is out of date, or a sample that does not match your market.</dd></div></dl>
  <h3 id="ground-level">Ground-Level Intelligence</h3>
  <p>${DEV} Some of the most important evidence is not written down anywhere. When an <a href="#intelligence-gaps">Intelligence Gap</a> could change a decision, <a href="#savoscouts">SavoScouts</a> can check prices, stock and shelves in person. Each observation is geo-tagged, time-stamped and checked before it is used.</p>
  <div class="ex"><div class="ex-h" role="tablist"><button type="button" class="ex-tab" role="tab" aria-selected="true">Preview</button><button type="button" class="ex-tab" role="tab" aria-selected="false">Context kept</button><span class="ex-l">Illustrative example</span></div><div class="ex-p" role="tabpanel"><div class="evc"><span class="evc-k">Ground-Level Intelligence</span><p class="evc-s">The 1-litre pack was out of stock in 6 of 9 kiosks checked near Kurmi Market.</p><dl class="evc-m"><div><dt>Source</dt><dd>SavoScout shelf check</dd></div><div><dt>Place</dt><dd>Kurmi Market, Kano</dd></div><div><dt>Time</dt><dd>Tuesday, 08:40</dd></div><div><dt>Scope</dt><dd>9 kiosks</dd></div><div><dt>Method</dt><dd>In-person observation, geo-tagged photo</dd></div></dl></div></div><div class="ex-p" role="tabpanel" hidden><div class="tbl"><table><thead><tr><th>Field</th><th>Value kept with this evidence</th></tr></thead><tbody><tr><th>Source</th><td>SavoScout shelf check</td></tr><tr><th>Place</th><td>Kurmi Market, Kano</td></tr><tr><th>Time</th><td>Tuesday, 08:40</td></tr><tr><th>Scope</th><td>9 kiosks</td></tr><tr><th>Method</th><td>In-person observation, geo-tagged photo</td></tr></tbody></table></div></div></div>
  <dl class="pst"><div><dt>Good for</dt><dd>What is happening on the ground, where little is documented.</dd></div><div><dt>Watch for</dt><dd>A small number of checks covers a small area. Scope keeps that visible.</dd></div></dl>
  <h3 id="together">How sources come together</h3>
  <p>For a single question, evidence from different sources is compared before it is used. Pieces that agree strengthen each other, a piece that stands alone is reported with its limits, and a piece that disagrees is kept alongside rather than dropped. The flow below follows 24 pieces of evidence gathered for one question about falling cooking oil sales in Kano.</p>
  <div class="ex"><div class="ex-h" role="tablist"><button type="button" class="ex-tab" role="tab" aria-selected="true">Preview</button><button type="button" class="ex-tab" role="tab" aria-selected="false">Data</button><span class="ex-l">Illustrative example</span></div><div class="ex-p" role="tabpanel"><svg class="sk" viewBox="0 0 720 348" role="img" aria-label="Illustrative flow of 24 pieces of evidence from five kinds of source into verification outcomes: 13 corroborated, 8 single source, 3 contradicted"><path class="sk-l sk-c" d="M212 10 C356.0 10 356.0 12.0 500 12.0 L500 56.0 C356.0 56.0 356.0 54 212 54 Z"><title>Company data → Corroborated: 4 pieces of evidence</title></path><path class="sk-l sk-c" d="M212 92 C356.0 92 356.0 56.0 500 56.0 L500 78.0 C356.0 78.0 356.0 114 212 114 Z"><title>Public records → Corroborated: 2 pieces of evidence</title></path><path class="sk-l sk-c" d="M212 141 C356.0 141 356.0 78.0 500 78.0 L500 111.0 C356.0 111.0 356.0 174 212 174 Z"><title>Digital platforms → Corroborated: 3 pieces of evidence</title></path><path class="sk-l sk-c" d="M212 212 C356.0 212 356.0 111.0 500 111.0 L500 122.0 C356.0 122.0 356.0 223 212 223 Z"><title>Research → Corroborated: 1 pieces of evidence</title></path><path class="sk-l sk-c" d="M212 250 C356.0 250 356.0 122.0 500 122.0 L500 155.0 C356.0 155.0 356.0 283 212 283 Z"><title>Ground-Level Intelligence → Corroborated: 3 pieces of evidence</title></path><path class="sk-l sk-s" d="M212 54 C356.0 54 356.0 185.0 500 185.0 L500 207.0 C356.0 207.0 356.0 76 212 76 Z"><title>Company data → Single source: 2 pieces of evidence</title></path><path class="sk-l sk-s" d="M212 114 C356.0 114 356.0 207.0 500 207.0 L500 218.0 C356.0 218.0 356.0 125 212 125 Z"><title>Public records → Single source: 1 pieces of evidence</title></path><path class="sk-l sk-s" d="M212 174 C356.0 174 356.0 218.0 500 218.0 L500 229.0 C356.0 229.0 356.0 185 212 185 Z"><title>Digital platforms → Single source: 1 pieces of evidence</title></path><path class="sk-l sk-s" d="M212 283 C356.0 283 356.0 229.0 500 229.0 L500 273.0 C356.0 273.0 356.0 327 212 327 Z"><title>Ground-Level Intelligence → Single source: 4 pieces of evidence</title></path><path class="sk-l sk-x" d="M212 185 C356.0 185 356.0 303.0 500 303.0 L500 314.0 C356.0 314.0 356.0 196 212 196 Z"><title>Digital platforms → Contradicted: 1 pieces of evidence</title></path><path class="sk-l sk-x" d="M212 223 C356.0 223 356.0 314.0 500 314.0 L500 325.0 C356.0 325.0 356.0 234 212 234 Z"><title>Research → Contradicted: 1 pieces of evidence</title></path><path class="sk-l sk-x" d="M212 327 C356.0 327 356.0 325.0 500 325.0 L500 336.0 C356.0 336.0 356.0 338 212 338 Z"><title>Ground-Level Intelligence → Contradicted: 1 pieces of evidence</title></path><rect x="200" y="10" width="12" height="66" rx="3" class="sk-n"/><text x="188" y="48.0" text-anchor="end" class="sk-t">Company data</text><text x="188" y="65.0" text-anchor="end" class="sk-v">6</text><rect x="200" y="92" width="12" height="33" rx="3" class="sk-n"/><text x="188" y="113.5" text-anchor="end" class="sk-t">Public records</text><text x="188" y="130.5" text-anchor="end" class="sk-v">3</text><rect x="200" y="141" width="12" height="55" rx="3" class="sk-n"/><text x="188" y="173.5" text-anchor="end" class="sk-t">Digital platforms</text><text x="188" y="190.5" text-anchor="end" class="sk-v">5</text><rect x="200" y="212" width="12" height="22" rx="3" class="sk-n"/><text x="188" y="228.0" text-anchor="end" class="sk-t">Research</text><text x="188" y="245.0" text-anchor="end" class="sk-v">2</text><rect x="200" y="250" width="12" height="88" rx="3" class="sk-n"/><text x="188" y="299.0" text-anchor="end" class="sk-t">Ground-Level Intelligence</text><text x="188" y="316.0" text-anchor="end" class="sk-v">8</text><rect x="500" y="12.0" width="12" height="143" rx="3" class="sk-n sk-cn"/><text x="524" y="88.5" class="sk-t">Corroborated</text><text x="524" y="105.5" class="sk-v">13</text><rect x="500" y="185.0" width="12" height="88" rx="3" class="sk-n sk-sn"/><text x="524" y="234.0" class="sk-t">Single source</text><text x="524" y="251.0" class="sk-v">8</text><rect x="500" y="303.0" width="12" height="33" rx="3" class="sk-n sk-xn"/><text x="524" y="324.5" class="sk-t">Contradicted</text><text x="524" y="341.5" class="sk-v">3</text></svg></div><div class="ex-p" role="tabpanel" hidden><div class="tbl"><table><thead><tr><th>Source</th><th>Corroborated</th><th>Single source</th><th>Contradicted</th><th>Total</th></tr></thead><tbody><tr><th>Company data</th><td>4</td><td>2</td><td>0</td><td>6</td></tr><tr><th>Public records</th><td>2</td><td>1</td><td>0</td><td>3</td></tr><tr><th>Digital platforms</th><td>3</td><td>1</td><td>1</td><td>5</td></tr><tr><th>Research</th><td>1</td><td>0</td><td>1</td><td>2</td></tr><tr><th>Ground-Level Intelligence</th><td>3</td><td>4</td><td>1</td><td>8</td></tr><tr><th>Total</th><td>13</td><td>8</td><td>3</td><td>24</td></tr></tbody></table></div></div></div>
  <dl class="pst"><div><dt>Corroborated</dt><dd>Supported by at least one independent source covering the same place and time.</dd></div><div><dt>Single source</dt><dd>Only one source so far. Used with its scope and limits made clear.</dd></div><div><dt>Contradicted</dt><dd>Another source points the other way. Both are shown, and the disagreement may become an Intelligence Gap.</dd></div></dl>
  ${note("No source is trusted or dismissed because of what kind it is. Each piece of evidence is judged on its own context. See <a href=\"#verification\">Verification</a>.")}` },
 { g: "Core concepts", id: "verification", t: "Verification and intelligence states", ic: "shield", crumb: "Core concepts", body: `
  <p class="intro">Verification checks whether evidence is reliable enough for its purpose. Intelligence states describe how firmly a conclusion is supported once it has been checked.</p>
  <h2 id="verification">Verification</h2>
  <p>Verification asks whether evidence is reliable enough for the purpose it will serve. It decides how much weight a piece of evidence can carry, and how confidently a conclusion built on it can be stated. ${DEV}</p>
  ${note("<b>Verification is not absolute truth.</b> It is a judgement about fitness for a purpose. Verified evidence can still be overturned by better evidence, and <a href=\"#market-memory\">Market Memory</a> records when that happens.", "warn")}
  <h3 id="checks">The checks</h3>
  <div class="tbl"><table><thead><tr><th>Check</th><th>What it asks</th></tr></thead><tbody>
   <tr><th>Consistency</th><td>Do the place, time and details hold together? Is a geo-tagged photo where the report says it is?</td></tr>
   <tr><th>Cross-source comparison</th><td>Do independent sources point the same way?</td></tr>
   <tr><th>Contributor track record</th><td>How reliable have this SavoScout's or this source's past observations proved?</td></tr>
   <tr><th>Peer confirmation</th><td>Has another contributor observed the same thing?</td></tr>
   <tr><th>Contradiction detection</th><td>Does anything already known conflict with it?</td></tr>
   <tr><th>Further investigation</th><td>Where the stakes justify it, a repeat visit, a targeted check or expert review.</td></tr>
  </tbody></table></div>
  <h3 id="proportion">In proportion to the decision</h3>
  <p>Not every question needs the same standard of proof. A quick look at prices can rest on lighter evidence than a decision to enter a new city. The checks applied, and how much corroboration is sought, are meant to scale with what the decision puts at risk.</p>
  <h3 id="disagree">When sources disagree</h3>
  <p>Disagreement is not quietly resolved in favour of one side. The contradiction is kept and shown with the evidence on each side. If it could change the decision, it becomes an <a href="#intelligence-gaps">Intelligence Gap</a> to investigate.</p>
  <h3 id="states">From verification to intelligence states</h3>
  <p>Verification is what moves a conclusion between <a href="#intelligence-states">intelligence states</a>. A claim supported by well-checked evidence within a defined scope can be stated as a Fact. One that is reasonably derived but not directly observed stays an Inference. An explanation still being tested stays a Hypothesis, and where the evidence cannot answer, the answer is Unknown.</p>
  <h3 id="example">Example: a stockout report</h3>
  <ol class="steps">
   <li><b>One observation</b><p>A SavoScout reports a product missing from a kiosk near a Lagos bus park, with a geo-tagged photo. It is one signal from one shop.</p></li>
   <li><b>Checked</b><p>The location and time match the photo, and the contributor's past reports have held up. The observation is reliable, but its scope is still one kiosk.</p></li>
   <li><b>Corroborated</b><p>Checks at nearby kiosks find the same gap in six of nine, and distributor records show a missed delivery that week. The stockout across that area can now be stated as a Fact within that scope.</p></li>
   <li><b>Still open</b><p>Why the delivery was missed is not yet known. That becomes the next question, and possibly an Intelligence Gap.</p></li>
  </ol>
  <p><em>Illustrative example.</em></p>
  <h2 id="intelligence-states">Intelligence states</h2>
  <p>Behind every answer, Verisavo works with five states of knowledge. They are how the system weighs evidence: separating what is supported from what is inferred, proposed, assumed or still unknown.</p>
  <p>They are part of how Verisavo reasons, not tags stamped on every sentence. What you see is the result: an answer that makes clear what the evidence supports, what it rests on and where the uncertainty is, in plain language.</p>
  <div class="states">
   <div class="state"><b class="st-term">Fact</b><p><strong>Sufficiently supported within a defined scope.</strong> Rely on it, within its scope.</p></div>
   <div class="state"><b class="st-term">Inference</b><p><strong>Reasonably derived from evidence, but not directly observed.</strong> Weigh it, and know what it rests on.</p></div>
   <div class="state"><b class="st-term">Hypothesis</b><p><strong>A proposed explanation that needs testing.</strong> Design a test before acting at scale.</p></div>
   <div class="state"><b class="st-term">Assumption</b><p><strong>Treated as true for this analysis, but not established.</strong> Keep it visible and revisit it.</p></div>
   <div class="state"><b class="st-term">Unknown</b><p><strong>The evidence cannot responsibly answer the question.</strong> Decide whether it matters enough to investigate.</p></div>
  </div>
  <h3 id="scope">Scope matters</h3>
  <p>A fact is a fact within a boundary. Evidence about one market in one month becomes an inference when it is applied to the next market or the next month.</p>
  <h3 id="labels-move">Understanding moves</h3>
  <p>New evidence can turn a hypothesis into a well-supported inference, or weaken an inference that no longer holds. <a href="#market-memory">Market Memory</a> records each change and the evidence behind it.</p>` },
 { g: "Core concepts", id: "intelligence-graph", t: "Market Intelligence Network and Market Memory", ic: "layers", crumb: "Core concepts", body: `
  <p class="intro">The Market Intelligence Network connects evidence across products, places, organisations and events. Market Memory keeps that understanding over time, so you can see what has changed.</p>
  <h2 id="intelligence-graph">Market Intelligence Network</h2>
  <p>The Market Intelligence Network is how Verisavo organises what it knows about a market. It links businesses, products, customers, competitors, prices, places, distribution channels and events, so they can be examined together rather than one report at a time. In the product you explore it as the Market Intelligence Network. ${DEV}</p>
  <h3 id="looks">What the graph looks like</h3>
  <p>A simplified example of how Verisavo could connect information around a fall in product sales.</p>
  ${IGFIG}
  <h3 id="parts">What it is made of</h3>
  <div class="tbl"><table><thead><tr><th>Part</th><th>What it is</th></tr></thead><tbody>
   <tr><th>Entities</th><td>The things in the market: a brand, a product, a retailer, a distributor, a price, a location, an event.</td></tr>
   <tr><th>Relationships</th><td>How they connect: a retailer stocks a product, a distributor supplies a store, a price change comes before a fall in sales.</td></tr>
   <tr><th><a href="#evidence">Evidence</a></th><td>What supports each entity and relationship, and how well that evidence supports it (see <a href="#intelligence-states">intelligence states</a>).</td></tr>
   <tr><th>Time</th><td>When each relationship held. A retailer that stocked a product in March may not stock it in May.</td></tr>
  </tbody></table></div>
  <h3 id="not-proof">A connection is not a cause</h3>
  <p>A sales dashboard can show that a product's sales fell by 20%. The graph lets Verisavo check whether that fall lines up with stockouts, competitor pricing, weaker distributor coverage or a change in what customers buy, and where several of these meet. It does not decide which one caused the fall. It sets the competing explanations side by side with their evidence and shows what would need to be checked to tell them apart.</p>
  ${note("<b>The graph shows relationships. The evidence decides how confidently they can be explained.</b> Every link is tied to its evidence and to how well supported it is, and a missing link that could change a decision becomes an <a href=\"#intelligence-gaps\">Intelligence Gap</a>.", "warn")}
  <h3 id="example">Example: falling sales of cooking oil</h3>
  <p>A cooking oil brand sees sales fall across Lagos and Ogun State. Each source on its own shows only a fragment.</p>
  ${GRAPHFIG}
  <p>Connected, the evidence might show that the fall is concentrated in neighbourhoods where deliveries were cut, and that the rival's smaller, cheaper pack is gaining shelf space there. That is a <b>hypothesis</b>, not a finding. The next steps are to corroborate it: check pack-size affordability with retailers, compare coverage before and after the change, and test whether restoring deliveries in specific areas recovers sales. <em>Illustrative example.</em></p>
  <h3 id="fits">How it fits with the rest</h3>
  <div class="tbl"><table><thead><tr><th>Part</th><th>Its job</th></tr></thead><tbody>
   <tr><th><a href="#evidence">Evidence</a></th><td>Holds each observation with its context.</td></tr>
   <tr><th><a href="#verification">Verification</a></th><td>Assesses whether that evidence is reliable enough for its purpose.</td></tr>
   <tr><th>Market Intelligence Network</th><td>Connects entities, events and relationships across sources.</td></tr>
   <tr><th><a href="#market-memory">Market Memory</a></th><td>Records how those connections and their evidence change over time.</td></tr>
   <tr><th><a href="#asking-questions">Intelligence Assistant</a></th><td>Uses the connected evidence to answer a specific business question.</td></tr>
  </tbody></table></div>
  <p>The graph might link one product to 30 retailers and three distributors. Market Memory keeps how those links have changed. The Assistant uses both to work through the question in front of you.</p>
  <p>Graph technology itself is not new. What Verisavo is building is its use for African markets: linking fragmented sources with first-hand observation, keeping every link tied to evidence and time, making uncertainty explicit, and pointing SavoScouts at the gaps that matter to a decision.</p>
  <h2 id="market-memory">Market Memory</h2>
  <p>Market Memory preserves how your understanding of a market develops: what was known, what changed and which evidence changed it. ${DEV}</p>
  <h3 id="keeps">What it keeps</h3>
  <ul><li>Findings, with the evidence behind them</li><li>Assumptions made along the way</li><li>Questions left open</li><li>Every change: when an explanation was strengthened, weakened or contradicted</li></ul>
  <h3 id="changes">Six ways new evidence changes what is known</h3>
  <div class="tbl"><table><thead><tr><th>Change</th><th>Meaning</th></tr></thead><tbody>
   <tr><th>Strengthen</th><td>Supports a conclusion from a new source, place or time.</td></tr><tr><th>Weaken</th><td>Makes a conclusion less likely without overturning it.</td></tr><tr><th>Contradict</th><td>Conflicts with what was believed and needs investigating.</td></tr><tr><th>Add context</th><td>Explains where, when or for whom a finding holds.</td></tr><tr><th>Reveal a pattern</th><td>Connects with earlier evidence to show something new.</td></tr><tr><th>Expose an Unknown</th><td>Shows that an unasked question could matter.</td></tr>
  </tbody></table></div>
  ${note("Evidence carries its date and scope, so an observation from two years ago is read as history, not as a description of today.")}` },
 { g: "Core concepts", id: "intelligence-gaps", t: "Intelligence Gaps", ic: "info", crumb: "Core concepts", body: `
  <p class="intro">An Intelligence Gap is a question the available evidence cannot answer, and that could change your decision. ${EA}</p>
  ${prompt("Who supplies the kiosks near the main bus park, and how often do they reorder?", "Example gap")}
  <h2 id="when">When a gap is raised</h2>
  <p>Verisavo raises a gap when an answer depends on something that is missing, out of date or contradicted, and when that missing piece would lead to a different action.</p>
  <h3 id="gap-or-unknown">A gap, or just an unknown?</h3>
  <p>Not every unknown is a gap. Many things are unknown and do not matter to the decision in front of you. A gap is an unknown that could change what you do, which is why it is worth the effort to close.</p>
  <h2 id="anatomy">What a gap tells you</h2>
  <div class="tbl"><table><thead><tr><th>Part</th><th>Example</th></tr></thead><tbody>
   <tr><th>The question</th><td>Who supplies the kiosks near the main bus park, and how often do they reorder?</td></tr>
   <tr><th>Why it matters</th><td>If kiosks reorder weekly, a price cut may work. If they rarely reorder, the problem is distribution.</td></tr>
   <tr><th>What the evidence shows</th><td>Distributor records cover supermarkets but not kiosks. Public data does not reach this level.</td></tr>
   <tr><th>What would close it</th><td>A shelf and supplier check at a sample of kiosks, repeated after two weeks.</td></tr>
   <tr><th>The cheapest route</th><td>Check your own distributor data first. If it cannot answer, scope a ground investigation.</td></tr>
  </tbody></table></div>
  <h2 id="what-next">What you can do with a gap</h2>
  <ul><li><strong>Accept it</strong> and decide with the uncertainty visible.</li><li><strong>Narrow it</strong> by adding company data you already hold, such as orders or distributor records.</li><li><strong>Investigate it</strong> with <a href="#savoscouts">SavoScouts</a>, who gather Ground-Level Intelligence on site. ${DEV}</li></ul>
  ${note("Closing a gap does not always mean the answer you hoped for. New evidence can strengthen a conclusion, weaken it or reveal a new unknown, and each outcome is recorded.")}` },
 { g: "Use Verisavo", id: "asking-questions", t: "Start with a market question", ic: "chat", crumb: "Use Verisavo", body: `
  <p class="intro">Ask Verisavo about a market challenge, an emerging change or a decision you're considering. The more relevant context you provide, the more focused the intelligence can be.</p>
  <h2 id="anatomy">Make Your Question More Specific</h2>
  <p>You don't need a perfect question. Start with what you want to understand, then add details such as location, timeframe and what you already know.</p>
  <div class="tbl"><table><thead><tr><th>Context</th><th>Broad</th><th>More Specific</th></tr></thead><tbody>
   <tr><th>Decision</th><td>Tell me about the market.</td><td>Should we open a showroom or introduce smaller solar kits?</td></tr>
   <tr><th>Location</th><td>In Nigeria.</td><td>In Lugbe, Abuja.</td></tr>
   <tr><th>Timeframe</th><td>Recently.</td><td>Over the last three months.</td></tr>
   <tr><th>Company Knowledge</th><td>No information provided.</td><td>Enquiries increased 48%, but conversions fell 21%.</td></tr>
  </tbody></table></div>
  <p>Verisavo uses this context to connect relevant information, examine available evidence and identify what may still need to be verified.</p>
  <h2 id="examples">Questions You Can Ask</h2>
  ${prompt("Which retailers near the main bus park in Surulere stock our 200ml pack, and how frequently do they reorder?", "Product Availability")}
  ${prompt("How have cooking oil prices changed in Kano since July, and which changes are supported by verified evidence?", "Pricing &amp; Competition")}
  ${prompt("Compare demand for small solar kits in Lugbe and Gwarinpa. Which location shows stronger potential, and what information is still missing?", "Market Expansion")}
  ${prompt("Why are customer enquiries increasing while completed sales are declining in Lugbe?", "Customer Intelligence")}
  <h2 id="scope">Add Market Context</h2>
  <p>Select a city, district or market to focus your question on a specific location. You can also attach relevant company data, such as sales reports, inventory records or market research, to help Verisavo understand your business and its objectives.</p>
  <p>When evidence is incomplete, Verisavo identifies what remains unknown and may recommend additional checks rather than presenting assumptions as facts.</p>
  <h2 id="your-data-private">Your Data Stays Private</h2>
  <p>Your company data remains private, protected and under your control. Verisavo uses it to support your market questions without making it publicly accessible.</p>
  ${note("See <a href=\"#privacy\">Privacy and Your Data</a> for more information.")}` },
 { g: "Use Verisavo", id: "measures", t: "Measures and charts", ic: "layers", crumb: "Use Verisavo", body: `
  <p class="intro">How Verisavo calculates common market measures, and how charts in an answer are marked up so you can read them in context.</p>
  <h2 id="market-measures">Market measures</h2>
  <p>Verisavo defines common market measures once, so availability, prices and coverage mean the same thing in every answer and every comparison. A measure is only shown with the scope it was calculated on. ${DEV}</p>
  <h3 id="why-measures">Why define measures</h3>
  <p>The same word can hide different calculations. One team's availability counts shelves, another's counts outlets, and a third averages percentages across cities with very different numbers of checks. Fixed definitions keep comparisons honest across places and over time.</p>
  <h3 id="example-measure">A worked example</h3>
  <div class="ex"><div class="ex-h" role="tablist"><button type="button" class="ex-tab" role="tab" aria-selected="true">Preview</button><button type="button" class="ex-tab" role="tab" aria-selected="false">Used in an answer</button><span class="ex-l">Illustrative example</span></div><div class="ex-p" role="tabpanel"><div class="mdef"><div class="mdef-h"><span class="evc-k">Measure</span><b>Shelf availability</b></div><p class="mdef-f">Outlets where the product was in stock <span>÷</span> outlets checked</p><dl class="evc-m"><div><dt>Counts</dt><dd>Outlets, not shelves or units</dd></div><div><dt>Needs</dt><dd>Place, date and number of outlets checked</dd></div><div><dt>Shown as</dt><dd>3 of 9 outlets (33%)</dd></div><div><dt>Adds up across areas</dt><dd>No. Recalculated from the outlet counts</dd></div></dl></div></div><div class="ex-p" role="tabpanel" hidden><p class="ex-txt">In an answer, the measure always travels with its scope:</p><div class="evc" style="margin-top:14px"><span class="evc-k">In an answer</span><p class="evc-s">The 1-litre pack was in stock in 3 of 9 kiosks checked near Kurmi Market on Tuesday (33%).</p><p class="ex-txt" style="font-size:.88rem">The count of outlets is shown next to the percentage, so 33% of 9 is never read as 33% of a city.</p></div></div></div>
  <h3 id="measure-reference">Measure reference</h3>
  <div class="tbl"><table><thead><tr><th>Measure</th><th>What it counts</th><th>Calculation</th><th>Needs</th></tr></thead><tbody><tr><th>Shelf availability</th><td>Outlets where the product was in stock</td><td>In-stock outlets ÷ outlets checked</td><td>Place, date, outlets checked</td></tr><tr><th>Price per litre (or kg)</th><td>What shoppers pay, adjusted for pack size</td><td>Shelf price ÷ pack size</td><td>Place, date, pack size, channel</td></tr><tr><th>Price gap</th><td>How far a rival is above or below you</td><td>(Rival − yours) ÷ yours, per litre</td><td>Both prices from the same place and period</td></tr><tr><th>Distribution coverage</th><td>How many known outlets stock you</td><td>Outlets stocking you ÷ known outlets in the area</td><td>A list of outlets for that area</td></tr><tr><th>Change since last reading</th><td>What moved between two readings</td><td>Latest value − earlier value, same scope</td><td>Two readings with matching scope ${DEV}</td></tr></tbody></table></div>
  <h3 id="combined-measures">Combined measures</h3>
  <p>Some measures are built from others. A combined measure is only calculated when its parts share the same place and period. When they do not, Verisavo shows the parts separately rather than forcing a comparison.</p>
  <div class="ex"><div class="ex-h" role="tablist"><button type="button" class="ex-tab" role="tab" aria-selected="true">Preview</button><button type="button" class="ex-tab" role="tab" aria-selected="false">When parts do not match</button><span class="ex-l">Illustrative example</span></div><div class="ex-p" role="tabpanel"><div class="mdef"><div class="mdef-h"><span class="evc-k">Combined measure</span><b>Price gap per litre</b></div><p class="mdef-f">(Rival price per litre <span>−</span> your price per litre) <span>÷</span> your price per litre</p><dl class="evc-m"><div><dt>Built from</dt><dd>Price per litre, measured twice</dd></div><div><dt>Rule</dt><dd>Both prices from the same place and period</dd></div><div><dt>Example</dt><dd>₦2,480 vs ₦2,920 per litre: −15%</dd></div><div><dt>If the rule fails</dt><dd>No gap is shown. The mismatch is named</dd></div></dl></div></div><div class="ex-p" role="tabpanel" hidden><p class="ex-txt">A rival price from an online platform in October and your shelf price from Kurmi Market in July are not compared directly. Verisavo shows both, with their place and date, and names the missing comparison as an <a href="#intelligence-gaps">Intelligence Gap</a>.</p></div></div>
  <h3 id="not-additive">Measures that do not add up</h3>
  <p>Percentages cannot simply be averaged across areas. If availability is 33% across 9 kiosks in one market and 80% across 40 shops in another, the combined figure is 71% (35 of 49 outlets), not the 57% a simple average gives. Verisavo recalculates from the underlying counts instead.</p>
  ${note("A measure inherits the reliability of the evidence behind it. A precise calculation on thin evidence is still thin evidence. See <a href=\"#evidence-sources\">Evidence sources</a>.")}
